# =============================================================================
# --- Project Information ---
# =============================================================================
# This section defines the basic identity of your website.
# It's used for browser tabs, search engine results, and site headers.

site_name: Resonance SRD
site_description: The complete System Reference Document for the Resonance Table-Top Roleplaying Game by David Beall.
site_author: David Beall
copyright: Copyright © 2010 - 2025 David Beall. Licensed under CC BY 4.0.


# =============================================================================
# --- Theme Configuration ---
# =============================================================================
# This section controls the entire look, feel, and feature set of your site.
# We are using the "material" theme and customizing it.

theme:
  name: material
  
  # --- Logo and Favicon ---
  # These files should be in your 'docs/assets/' folder.
  logo: assets/logo.png
  favicon: assets/logo.png

  # --- Color Palette ---
  # 'slate' is a dark mode theme. 'primary' is the main color for the header
  # and sidebar, and 'accent' is for links and highlights.
  palette:
    scheme: slate
    primary: brown
    accent: amber

  # --- Font Configuration ---
  # We tell the site to load 'Lora' from Google Fonts.
  # Oswald and Calibri will be handled by our custom CSS file.
  font:
    text: Lora
    code: Roboto Mono

  # --- Feature Flags ---
  # These turn on powerful, built-in features of the theme.
  features:
    - navigation.instant         # Makes page loads feel instant
    - navigation.tracking        # The left sidebar tracks your scroll position
    - navigation.tabs            # Main sections appear as tabs at the top
    - navigation.sections        # Expands sections in the left sidebar
    - navigation.top             # Adds a "Back to Top" button
    - search.suggest             # Autocompletes search queries
    - search.highlight           # Highlights search terms on the page
    - content.code.annotate      # Allows for annotations on code blocks


