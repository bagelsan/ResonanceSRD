<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychromattica Blueprint Builder</title>
    <!-- LINK TO SHARED ENGINE & DATA -->
    <script src="PsychromatticaEngine.js"></script>
    <style>
        :root {
            --color-null: #dea193; --color-silver: #a7a9ac; --color-yellow: #f5d36c;
            --color-green: #688d4c; --color-black: #414042; --color-orange: #f7855d;
            --color-white: #e3e1da; --color-red: #a95b5a; --color-blue: #88bfe8;
            --color-purple: #957fa3; --color-background: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--color-background); color: var(--color-white); font-family: Calibri, sans-serif; font-size: 12pt; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        h2, h3, h4 { font-weight: normal; font-family: 'Oswald', sans-serif; color: var(--color-null); }
        h3 { color: var(--color-silver); margin-top: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        h4 { color: var(--color-yellow); margin-bottom: 5px;}
        
        .section { border: 1px solid var(--color-black); background-color: #2a2a2a; padding: 15px; border-radius: 3px; }
        button { background-color: var(--color-black); color: var(--color-white); border: 1px solid var(--color-silver); padding: 8px 12px; font-family: Calibri, sans-serif; font-size: 10pt; cursor: pointer; border-radius: 2px; transition: 0.2s; }
        button:hover { background-color: var(--color-silver); color: var(--color-black); }
        .button-small { padding: 4px 8px; font-size: 9pt; }
        .remove-button { background-color: var(--color-red); border-color: var(--color-red); color: white;}
        
        input[type="text"], input[type="number"], select { background-color: #333; border: 1px solid var(--color-silver); color: var(--color-white); padding: 8px; font-family: Calibri, sans-serif; width: 100%; border-radius: 2px; margin-top: 5px; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>"); background-repeat: no-repeat; background-position-x: 100%; background-position-y: 5px; }
        label { font-size: 10pt; color: var(--color-silver); display: block; margin-top: 10px; font-weight: bold;}
        
        #output-string { font-family: 'Courier New', Courier, monospace; font-size: 12pt; background-color: #1a1a1a; color: var(--color-yellow); padding: 10px; width: 100%; min-height: 60px; border: 1px solid #444; border-radius: 2px; resize: vertical;}
        
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .grid-5, .grid-3 { grid-template-columns: 1fr; } }
        
        .card { background-color: #333; border-left: 4px solid var(--color-blue); padding: 15px; margin-top: 15px; position: relative; }
        .level-up-card { border-left-color: var(--color-green); }
        .flaw-card { border-left-color: var(--color-red); background-color: #2b1d1d;}
        hr { border: none; border-top: 1px dashed #555; margin: 15px 0; }
        
        .inline-checkbox { display: inline-flex; align-items: center; gap: 10px; font-size: 10pt; cursor: pointer; color: var(--color-white);}
        
        #live-validation { background: #111; padding: 10px; border-radius: 3px; border: 1px solid var(--color-silver); margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center; text-transform: uppercase; font-size: 11pt;}
        #live-validation span { color: var(--color-yellow); font-weight: bold; font-size: 1.2em;}
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h2>Blueprint Compiler</h2>
            <div id="live-validation">
                <div>Level: <span id="val-lvl">0</span></div>
                <div>Resistance: <span id="val-res">3</span></div>
                <div>Keywords: <span id="val-kws">0</span></div>
            </div>
            <textarea id="output-string" readonly></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="copy-button">Copy</button>
                <button id="send-sheet-button" style="background-color: var(--color-purple); color: white;">Load to Character Sheet</button>
            </div>
        </div>

        <div class="section" id="character-builder">
            <h2>Character Architecture</h2>
            <h3>1. The Profile</h3>
            <div class="grid-5" id="profile-selectors">
                <div><label>Goal</label><select id="goal"></select></div>
                <div><label>Method</label><select id="method"></select></div>
                <div><label>Purpose</label><select id="purpose"></select></div>
                <div><label>External</label><select id="external"></select></div>
                <div><label>Internal</label><select id="internal"></select></div>
            </div>
            <h3>2. The Origin (Level 0)</h3>
            <div class="grid-2" style="align-items: end;">
                <div><label>Seed Keyword</label><select class="keyword-select" id="seed-keyword"></select></div>
                <div><label class="inline-checkbox"><input type="checkbox" id="seed-passive"> Set as Passive (!)</label></div>
            </div>
            <h3>3. The Awakening (Level 1)</h3>
            <div class="card">
                <div class="grid-3" id="awakening-keywords">
                    <div><label>Keyword 1</label><select class="keyword-select"></select></div>
                    <div><label>Keyword 2</label><select class="keyword-select"></select></div>
                    <div><label>Keyword 3</label><select class="keyword-select"></select></div>
                </div>
                <hr>
                <h4>Trinity Stat Bonus</h4>
                <div class="grid-3" id="trinity-stats-container">
                    <div><label>Bonus 1</label><select class="stat-select"></select></div>
                    <div><label>Bonus 2</label><select class="stat-select"></select></div>
                    <div><label>Bonus 3</label><select class="stat-select"></select></div>
                </div>
            </div>
            <h3>4. Progression & Flaws</h3>
            <div id="level-up-container"></div>
            <div class="grid-2">
                <button id="add-level-button">Add Level (+2 KWs, +1 Stat)</button>
                <button id="add-flaw-button" style="background: var(--color-red); color: white; border-color: var(--color-red);">Add Flaw Package</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'psychro_builder_draft';
            let hasFlaw = false;

            function createOptions(dict, filterFn = () => true) {
                return Object.entries(dict)
                    .filter(filterFn)
                    .map(([val, data]) => {
                        const name = typeof data === 'object' ? data.name : data;
                        return `<option value="${val}">${val}: ${name}</option>`;
                    }).join('');
            }

            function initSelects() {
                const profileHtml = '<option value="0">Select...</option>' + createOptions(PsychroEngine.Data.MOTIVATIONS);
                document.querySelectorAll('#profile-selectors select').forEach(sel => sel.innerHTML = profileHtml);
                const kwHtml = '<option value="">Keyword...</option>' + createOptions(PsychroEngine.Data.KEYWORDS);
                document.querySelectorAll('.keyword-select').forEach(sel => sel.innerHTML = kwHtml);
                const statHtml = '<option value="">Stat...</option>' + createOptions(PsychroEngine.Data.STAT_NAMES);
                document.querySelectorAll('.stat-select').forEach(sel => sel.innerHTML = statHtml);
            }

            document.getElementById('add-level-button').addEventListener('click', () => {
                const container = document.getElementById('level-up-container');
                const lvl = 2 + container.querySelectorAll('.level-up-card').length;
                if (lvl > 9) return;
                const card = document.createElement('div');
                card.className = 'card level-up-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;"><h4>Level ${lvl}</h4><button class="remove-button button-small rm-lvl">X</button></div>
                    <div class="grid-3">
                        <div><label>Keyword 1</label><select class="keyword-select prog-kw"></select></div>
                        <div><label>Keyword 2</label><select class="keyword-select prog-kw"></select></div>
                        <div><label>Stat Point</label><select class="stat-select prog-stat"></select></div>
                    </div>
                `;
                card.querySelectorAll('.keyword-select').forEach(s => s.innerHTML = '<option value="">Keyword...</option>' + createOptions(PsychroEngine.Data.KEYWORDS));
                card.querySelector('.stat-select').innerHTML = '<option value="">Stat...</option>' + createOptions(PsychroEngine.Data.STAT_NAMES);
                container.appendChild(card);
                compileBlueprint();
            });

            document.getElementById('add-flaw-button').addEventListener('click', () => {
                if (hasFlaw) return alert("Characters can only have one Flaw Package.");
                const container = document.getElementById('level-up-container');
                const card = document.createElement('div');
                card.className = 'card flaw-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;"><h4>Narrative Flaw Package</h4><button class="remove-button button-small rm-flaw">X</button></div>
                    <div class="grid-2">
                        <div><label>Flaw (Ends in 0)</label><select class="flaw-select"><option value="">Flaw...</option>${createOptions(PsychroEngine.Data.KEYWORDS, ([k]) => k.endsWith('0'))}</select></div>
                        <div><label>Compensation</label><select class="comp-select"><option value="">Comp...</option>${createOptions(PsychroEngine.Data.KEYWORDS, ([k]) => !k.endsWith('0'))}</select></div>
                    </div>
                `;
                container.appendChild(card);
                hasFlaw = true;
                document.getElementById('add-flaw-button').disabled = true;
                compileBlueprint();
            });

            document.getElementById('level-up-container').addEventListener('click', e => {
                if(e.target.classList.contains('rm-lvl')) { e.target.closest('.card').remove(); compileBlueprint(); }
                if(e.target.classList.contains('rm-flaw')) { e.target.closest('.card').remove(); hasFlaw = false; document.getElementById('add-flaw-button').disabled = false; compileBlueprint(); }
            });

            document.getElementById('character-builder').addEventListener('change', compileBlueprint);

            function compileBlueprint() {
                let bp = "C:";
                const profile = Array.from(document.querySelectorAll('#profile-selectors select')).map(s => s.value).join('');
                bp += profile;
                const seedKw = document.getElementById('seed-keyword').value;
                const seedPass = document.getElementById('seed-passive').checked ? '!' : '';
                if(seedKw) bp += `-${seedPass}${seedKw}`;
                const awkKws = Array.from(document.querySelectorAll('#awakening-keywords select')).map(s => s.value).filter(Boolean);
                const awkStats = Array.from(document.querySelectorAll('#trinity-stats-container select')).map(s => s.value).filter(Boolean);
                if (awkKws.length > 0 || awkStats.length > 0) {
                    bp += `-${awkKws.join('.')}`;
                    if(awkStats.length > 0) bp += `.${awkStats.join('')}`;
                }
                const levelCards = document.getElementById('level-up-container').children;
                Array.from(levelCards).forEach(card => {
                    if (card.classList.contains('level-up-card')) {
                        const kws = Array.from(card.querySelectorAll('.prog-kw')).map(s => s.value).filter(Boolean);
                        const stat = card.querySelector('.prog-stat').value;
                        if(kws.length > 0 || stat) {
                            bp += `-${kws.join('.')}`;
                            if (stat) bp += `.${stat}`;
                        }
                    } else if (card.classList.contains('flaw-card')) {
                        const flaw = card.querySelector('.flaw-select').value;
                        const comp = card.querySelector('.comp-select').value;
                        if(flaw && comp) bp += `+${flaw}${comp}`;
                    }
                });

                document.getElementById('output-string').value = bp;
                
                // PERSISTENCE: Save current string
                localStorage.setItem(STORAGE_KEY, bp);
                
                const ast = PsychroEngine.Parse.entity(bp);
                if (ast) {
                    document.getElementById('val-lvl').textContent = ast.level;
                    document.getElementById('val-res').textContent = ast.resistance;
                    document.getElementById('val-kws').textContent = ast.keywords.length;
                }
            }

            window.addEventListener('message', (event) => {
                if(event.data.type === 'ROUTE_PROFILE') {
                    const codes = event.data.payload.split('');
                    if(codes.length === 5) {
                        const selects = document.querySelectorAll('#profile-selectors select');
                        selects.forEach((sel, i) => sel.value = codes[i]);
                        compileBlueprint();
                    }
                }
            });

            document.getElementById('copy-button').addEventListener('click', () => {
                const out = document.getElementById('output-string');
                out.select(); navigator.clipboard.writeText(out.value);
            });
            document.getElementById('send-sheet-button').addEventListener('click', () => {
                const bp = document.getElementById('output-string').value;
                if(bp) window.parent.postMessage({ type: 'LOAD_BLUEPRINT', payload: bp }, '*');
            });

            initSelects();
            
            // LOAD PERSISTED DRAFT
            const savedDraft = localStorage.getItem(STORAGE_KEY);
            if (savedDraft) {
                document.getElementById('output-string').value = savedDraft;
            }
        });
    </script>
</body>
</html>
