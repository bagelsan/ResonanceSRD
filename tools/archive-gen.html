<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Archive Room Generator</title>
    <style>
        /* --- Styling (Consistent with Site Theme) --- */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Lora&display=swap');

        body {
            background-color: #212121;
            color: #ccc;
            font-family: "Calibri", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 2em;
        }

        h1, h2, h3, h4 {
            font-family: "Oswald", sans-serif;
            color: #D2B48C;
        }

        #generator-container {
            max-width: 900px;
            margin: 0 auto;
        }

        #generator-form {
            background-color: #333;
            padding: 2em;
            border-radius: 8px;
            border: 1px solid #444;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-family: "Oswald", sans-serif;
            margin-bottom: 0.5em;
            color: #ccc;
        }

        .form-group select, .form-group input {
            padding: 0.8em;
            background-color: #424242;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 1em;
        }

        #generate-btn {
            grid-column: 1 / -1;
            padding: 1em;
            font-family: "Oswald", sans-serif;
            font-size: 1.5em;
            color: #212121;
            background-color: #FFC107;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1em;
            transition: background-color 0.2s ease-in-out;
        }

        #generate-btn:hover {
            background-color: #FFD54F;
        }

        #output-container {
            display: none;
            margin-top: 2em;
            padding: 2em;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            font-family: "Lora", serif;
        }
        
        #output-container h2 {
            text-align: center;
            margin-top: 0;
        }

        #output-content {
            background-color: #212121;
            padding: 1.5em;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 1.1em;
            line-height: 1.5;
        }

        #output-content strong {
            color: #D2B48C;
            font-family: "Oswald", sans-serif;
        }
        #output-content code {
            color: #FFC107;
            background-color: #424242;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .situation-block {
            border-top: 2px solid #555;
            margin-top: 1.5em;
            padding-top: 1.5em;
        }
        .entity-block {
            border-left: 3px solid #444;
            padding-left: 1em;
            margin-top: 1em;
            margin-bottom: 1em;
        }
        .profile-section {
            border-top: 1px dashed #444;
            margin-top: 1.5em;
            padding-top: 1.5em;
        }
        .profile-section p {
            font-family: "Lora", serif;
            font-style: italic;
            color: #ccc;
        }
        .flaw-keyword { color: #e57373; }
        .compensation-keyword { color: #80cbc4; }
        .keyword-tag { font-weight: bold; font-style: normal; color: #ccc; }
        .keyword-meta { color: #888; font-style: italic; }

    </style>
</head>
<body>

    <div id="generator-container">
        <h1>Archive Room Generator</h1>
        <p>This tool uses the Blueprint Method from Appendix I to generate a complete, detailed, and thematically coherent Scene (a "Room") for the Archive game mode.</p>
        
        <div id="generator-form">
            <div class="form-group">
                <label for="party-level">Party Level</label>
                <input type="number" id="party-level" min="1" max="9" value="1">
            </div>
            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="-1">Easy (L-1)</option>
                    <option value="0" selected>Normal (L+0)</option>
                    <option value="1">Hard (L+1)</option>
                    <option value="2">Boss (L+2)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="theme">Theme</label>
                <select id="theme">
                    <option value="random">Random</option>
                    <option value="Null">Null</option>
                    <option value="Silver">Silver</option>
                    <option value="Yellow">Yellow</option>
                    <option value="Green">Green</option>
                    <option value="Black">Black</option>
                    <option value="Orange">Orange</option>
                    <option value="White">White</option>
                    <option value="Red">Red</option>
                    <option value="Blue">Blue</option>
                    <option value="Purple">Purple</option>
                </select>
            </div>
            <button type="button" id="generate-btn">Generate Room</button>
        </div>

        <div id="output-container">
            <h2>Generated Room</h2>
            <pre id="output-content"></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- DATA (Keywords, Motivations, etc.) ---
            const keywordsData = [
                { id: "0.0", name: "Restricted", color: "Null", category: "Flaw" }, { id: "0.1", name: "Aura", color: "Null", category: "Gift" }, { id: "0.2", name: "Specialist", color: "Null", category: "Talent" }, { id: "0.3", name: "Alert", color: "Null", category: "Quirk" }, { id: "0.4", name: "Liberate", color: "Null", category: "Boost" }, { id: "0.5", name: "Mark", color: "Null", category: "Status" }, { id: "0.6", name: "Indirect", color: "Null", category: "Form" }, { id: "0.7", name: "Adaptive", color: "Null", category: "Modifier" }, { id: "0.8", name: "Gamble", color: "Null", category: "Drive" }, { id: "0.9", name: "Edit", color: "Null", category: "Unique" },
                { id: "1.0", name: "Bane", color: "Silver", category: "Flaw" }, { id: "1.1", name: "Traveller", color: "Silver", category: "Gift" }, { id: "1.2", name: "Martial", color: "Silver", category: "Talent" }, { id: "1.3", name: "Attuned", color: "Silver", category: "Quirk" }, { id: "1.4", name: "Augment", color: "Silver", category: "Boost" }, { id: "1.5", name: "Impair", color: "Silver", category: "Status" }, { id: "1.6", name: "Reactive", color: "Silver", category: "Form" }, { id: "1.7", name: "Phasing", color: "Silver", category: "Modifier" }, { id: "1.8", name: "Brutal", color: "Silver", category: "Drive" }, { id: "1.9", name: "Translocate", color: "Silver", category: "Unique" },
                { id: "2.0", name: "Anxious", color: "Yellow", category: "Flaw" }, { id: "2.1", name: "Acrobatic", color: "Yellow", category: "Gift" }, { id: "2.2", name: "Sentry", color: "Yellow", category: "Talent" }, { id: "2.3", name: "Eidetic", color: "Yellow", category: "Quirk" }, { id: "2.4", name: "Haste", color: "Yellow", category: "Boost" }, { id: "2.5", name: "Slow", color: "Yellow", category: "Status" }, { id: "2.6", name: "Snap", color: "Yellow", category: "Form" }, { id: "2.7", name: "Condense", color: "Yellow", category: "Modifier" }, { id: "2.8", name: "Rapid", color: "Yellow", category: "Drive" }, { id: "2.9", name: "Reckless", color: "Yellow", category: "Unique" },
                { id: "3.0", name: "Hesitant", color: "Green", category: "Flaw" }, { id: "3.1", name: "Sturdy", color: "Green", category: "Gift" }, { id: "3.2", name: "Brawler", color: "Green", category: "Talent" }, { id: "3.3", name: "Stubborn", color: "Green", category: "Quirk" }, { id: "3.4", name: "Ward", color: "Green", category: "Boost" }, { id: "3.5", name: "Daze", color: "Green", category: "Status" }, { id: "3.6", name: "Sculpt", color: "Green", category: "Form" }, { id: "3.7", name: "Defensive", color: "Green", category: "Modifier" }, { id: "3.8", name: "Impact", color: "Green", category: "Drive" }, { id: "3.9", name: "Shift", color: "Green", category: "Unique" },
                { id: "4.0", name: "Feeble", color: "Black", category: "Flaw" }, { id: "4.1", name: "Survivor", color: "Black", category: "Gift" }, { id: "4.2", name: "Stoic", color: "Black", category: "Talent" }, { id: "4.3", name: "Ageless", color: "Black", category: "Quirk" }, { id: "4.4", name: "Bless", color: "Black", category: "Boost" }, { id: "4.5", name: "Curse", color: "Black", category: "Status" }, { id: "4.6", name: "Piercing", color: "Black", category: "Form" }, { id: "4.7", name: "Flux", color: "Black", category: "Modifier" }, { id: "4.8", name: "Siphon", color: "Black", category: "Drive" }, { id: "4.9", name: "Animate", color: "Black", category: "Unique" },
                { id: "5.0", name: "Gremlins", color: "Orange", category: "Flaw" }, { id: "5.1", name: "Sensor", color: "Orange", category: "Gift" }, { id: "5.2", name: "Improvisor", color: "Orange", category: "Talent" }, { id: "5.3", name: "Crafty", color: "Orange", category: "Quirk" }, { id: "5.4", name: "Charge", color: "Orange", category: "Boost" }, { id: "5.5", name: "Bind", color: "Orange", category: "Status" }, { id: "5.6", name: "Imbue", color: "Orange", category: "Form" }, { id: "5.7", name: "Material", color: "Orange", category: "Modifier" }, { id: "5.8", name: "Leverage", color: "Orange", category: "Drive" }, { id: "5.9", name: "Manifest", color: "Orange", category: "Unique" },
                { id: "6.0", name: "Vulnerable", color: "White", category: "Flaw" }, { id: "6.1", name: "Tolerant", color: "White", category: "Gift" }, { id: "6.2", name: "Deadeye", color: "White", category: "Talent" }, { id: "6.3", name: "Immunized", color: "White", category: "Quirk" }, { id: "6.4", name: "Cure", color: "White", category: "Boost" }, { id: "6.5", name: "Weaken", color: "White", category: "Status" }, { id: "6.6", name: "Sticky", color: "White", category: "Form" }, { id: "6.7", name: "Restore", color: "White", category: "Modifier" }, { id: "6.8", name: "Exploit", color: "White", category: "Drive" }, { id: "6.9", name: "Growth", color: "White", category: "Unique" },
                { id: "7.0", name: "Limited", color: "Red", category: "Flaw" }, { id: "7.1", name: "Resilient", color: "Red", category: "Gift" }, { id: "7.2", name: "Font", color: "Red", category: "Talent" }, { id: "7.3", name: "Insulated", color: "Red", category: "Quirk" }, { id: "7.4", name: "Regen", color: "Red", category: "Boost" }, { id: "7.5", name: "Blight", color: "Red", category: "Status" }, { id: "7.6", name: "Area", color: "Red", category: "Form" }, { id: "7.7", name: "Ranged", color: "Red", category: "Modifier" }, { id: "7.8", name: "Multiply", color: "Red", category: "Drive" }, { id: "7.9", name: "Split", color: "Red", category: "Unique" },
                { id: "8.0", name: "Awkward", color: "Blue", category: "Flaw" }, { id: "8.1", name: "Charismatic", color: "Blue", category: "Gift" }, { id: "8.2", name: "Leader", color: "Blue", category: "Talent" }, { id: "8.3", name: "Insightful", color: "Blue", category: "Quirk" }, { id: "8.4", name: "Enhance", color: "Blue", category: "Boost" }, { id: "8.5", name: "Silence", color: "Blue", category: "Status" }, { id: "8.6", name: "Splash", color: "Blue", category: "Form" }, { id: "8.7", name: "Lingering", color: "Blue", category: "Modifier" }, { id: "8.8", name: "Spread", color: "Blue", category: "Drive" }, { id: "8.9", name: "Potent", color: "Blue", category: "Unique" },
                { id: "9.0", name: "Mundane", color: "Purple", category: "Flaw" }, { id: "9.1", name: "Aware", color: "Purple", category: "Gift" }, { id: "9.2", name: "Stealthy", color: "Purple", category: "Talent" }, { id: "9.3", name: "Trickster", color: "Purple", category: "Quirk" }, { id: "9.4", name: "Obscure", color: "Purple", category: "Boost" }, { id: "9.5", name: "Nullify", color: "Purple", category: "Status" }, { id: "9.6", name: "Chain", color: "Purple", category: "Form" }, { id: "9.7", name: "Natural", color: "Purple", category: "Modifier" }, { id: "9.8", name: "Ambience", color: "Purple", category: "Drive" }, { id: "9.9", name: "Channel", color: "Purple", category: "Unique" }
            ].map(kw => ({...kw, colorName: ["Null", "Silver", "Yellow", "Green", "Black", "Orange", "White", "Red", "Blue", "Purple"][parseInt(kw.id.charAt(0))]}));
            const motivations = [
                { name: "Absolution", color: "Silver" }, { name: "Ambition", color: "Yellow" }, { name: "Security", color: "Green" }, { name: "Legacy", color: "Black" }, { name: "Innovation", color: "Orange" }, { name: "Purity", color: "White" }, { name: "Glory", color: "Red" }, { name: "Influence", color: "Blue" }, { name: "Faith", color: "Purple" }, { name: "Discovery", color: "Null" }
            ];
            const colorToStat = {
                Silver: 'M', Yellow: 'A', Green: 'B', Black: 'W', Orange: 'E', White: 'T', Red: 'P', Blue: 'I', Purple: 'F', Null: null
            };
            const statNames = ['M', 'A', 'B', 'W', 'E', 'T', 'P', 'I', 'F'];

            // --- UI Elements ---
            const generateBtn = document.getElementById('generate-btn');
            const outputContainer = document.getElementById('output-container');
            const outputContent = document.getElementById('output-content');

            // --- Event Listener ---
            generateBtn.addEventListener('click', generateRoom);

            // --- Helper Functions ---
            function getRandomElement(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
            function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
            function getRandomKeyword(excludeList = []) {
                const availableKeywords = keywordsData.filter(kw => !excludeList.find(ex => ex.id === kw.id));
                if (availableKeywords.length === 0) return null;
                return getRandomElement(availableKeywords);
            }
            function findKeyword(id) { return keywordsData.find(kw => kw.id === id); }

            // --- Main Orchestrator ---
            function generateRoom() {
                const partyLevel = parseInt(document.getElementById('party-level').value);
                const difficulty = parseInt(document.getElementById('difficulty').value);
                const themeColor = document.getElementById('theme').value;

                const themeKeyword = getRandomElement(keywordsData.filter(kw => themeColor === 'random' || kw.colorName === themeColor));
                const themeCode = themeKeyword.id.replace('.', '');
                
                const complexity = Math.floor(parseInt(themeCode.charAt(0)) / 2) + 1;
                let situationCodes = [];
                for (let i = 0; i < complexity; i++) {
                    let code = getRandomInt(1, 9).toString();
                    if (Math.random() < 0.15) code = '*' + code;
                    situationCodes.push(code);
                }
                const blueprintString = `(${complexity})[${themeCode}]-${situationCodes.join('|')}`;

                let output = `<strong>BLUEPRINT:</strong> <code>${blueprintString}</code>\n`;
                output += `<strong>THEME:</strong> ${themeKeyword.name} (${themeKeyword.colorName})\n\n`;

                situationCodes.forEach((code, index) => {
                    output += `<div class="situation-block">`;
                    output += generateSituationContent(code, index + 1, partyLevel, difficulty);
                    output += `</div>`;
                });

                outputContent.innerHTML = output;
                outputContainer.style.display = 'block';
            }

            function generateSituationContent(code, sitNum, partyLevel, difficulty) {
                const isTimed = code.startsWith('*');
                const sitCode = parseInt(code.replace('*', ''));
                
                let sitTitle = `<h4>SITUATION ${sitNum}</h4>`;
                if (isTimed) sitTitle += "<strong>(TIMED PHASE)</strong>\n";
                if (sitCode === 0) sitTitle += "<strong>(TWIST!)</strong>\n";
                if (sitCode === 5) sitTitle += "<strong>(REST)</strong>\n";

                let content = sitTitle;
                
                if (sitCode === 0) {
                    content += "  - The situation is interrupted by a new, randomly generated Scene!\n";
                    return content;
                }
                if (sitCode === 5) {
                    content += "  - The party has a moment of respite. They may perform a free recovery or prep action.\n";
                    return content;
                }

                const numEntities = getRandomInt(1, 2);
                for (let i = 0; i < numEntities; i++) {
                    const entityTypeRoll = getRandomInt(1, 3);
                    let levelOffset = difficulty;
                    if (isTimed && sitCode === 1 && i === 0) { levelOffset = difficulty + 2; }
                    const finalLevel = Math.max(0, partyLevel + levelOffset);

                    switch(entityTypeRoll) {
                        case 1: content += generateBarrier(finalLevel); break;
                        case 2: content += generatePuzzle(finalLevel); break;
                        case 3: content += (Math.random() < 0.3) ? generateCharacter(finalLevel, 'random', true) : generateAnimation(finalLevel, 'random', true); break;
                    }
                }

                // Chaos Slot
                const chaosRoll = getRandomInt(1, 10);
                const chaosLevel = Math.max(0, partyLevel + difficulty);
                content += "<h4>CHAOS SLOT</h4>";
                switch(true) {
                    case (chaosRoll <= 2): content += generateCharacter(chaosLevel, 'random', true); break;
                    case (chaosRoll <= 6): content += generateAnimation(chaosLevel, 'random', true); break;
                    case (chaosRoll <= 9): content += generateItem(getRandomInt(1, 4)); break;
                    case (chaosRoll === 10): content += generateCharacter(chaosLevel + 1, 'random', true); break;
                }
                return content;
            }

            // --- Entity Generation Functions ---
            function generateMotivationalProfile() {
                const shuffled = [...motivations].sort(() => 0.5 - Math.random());
                return { goal: shuffled[0], method: shuffled[1], purpose: shuffled[2], external: shuffled[3], internal: shuffled[4] };
            }

            function generateProfileHTML(profile) {
                let html = `\n<div class="profile-section">`;
                html += `<strong>5-POINT MOTIVATIONAL PROFILE:</strong>\n`;
                html += `  <strong>Goal:</strong> ${profile.goal.name} (${profile.goal.color})\n`;
                html += `  <strong>Method:</strong> ${profile.method.name} (${profile.method.color})\n`;
                html += `  <strong>Purpose:</strong> ${profile.purpose.name} (${profile.purpose.color})\n`;
                html += `  <strong>External Conflict:</strong> ${profile.external.name} (${profile.external.color})\n`;
                html += `  <strong>Internal Conflict:</strong> ${profile.internal.name} (${profile.internal.color})\n\n`;
                html += `<p>This entity is driven by a core goal of **${profile.goal.name}**. They pursue this through a method of **${profile.method.name}**, believing their actions are justified by a deeper purpose of **${profile.purpose.name}**. They often find themselves in conflict with those who embody **${profile.external.name}**, and they secretly struggle with their own internal pull towards **${profile.internal.name}**.</p>`;
                html += `</div>`;
                return html;
            }

            function generateCharacter(level, seedId = 'random', isNPC = false) {
                const statPointGains = { 2:1, 3:1, 4:1, 5:1, 6:2, 7:2, 8:2, 9:2 };
                const profile = generateMotivationalProfile();
                const primaryColor = profile.goal.color;
                
                let stats = { M: 1, A: 1, B: 1, W: 1, E: 1, T: 1, P: 1, I: 1, F: 1 };
                let keywordList = [];
                let hasFlaw = false;
                
                const totalAcquisitions = (level > 0) ? 4 + (level - 1) * 2 : 1;

                for (let i = 0; i < totalAcquisitions; i++) {
                    let newKeyword;
                    if (i === 0 && seedId !== 'random') {
                        newKeyword = findKeyword(seedId);
                    } else if (i === 0) {
                        const thematicKeywords = keywordsData.filter(kw => kw.color === primaryColor && kw.category !== 'Flaw' && !keywordList.find(item => item.kw.id === kw.id));
                        newKeyword = (thematicKeywords.length > 0) ? getRandomElement(thematicKeywords) : getRandomKeyword(keywordList.map(item => item.kw));
                    } else {
                        newKeyword = getRandomKeyword(keywordList.map(item => item.kw));
                    }

                    if (newKeyword.category === 'Flaw') {
                        if (hasFlaw) {
                            while (newKeyword.category === 'Flaw') { newKeyword = getRandomKeyword(keywordList.map(item => item.kw)); }
                            keywordList.push({ kw: newKeyword, role: 'Normal' });
                        } else {
                            hasFlaw = true;
                            const flaw = newKeyword;
                            const compensation = getRandomKeyword(keywordList.map(item => item.kw).concat([flaw]), kw => kw.category !== 'Flaw');
                            const bonus = getRandomKeyword(keywordList.map(item => item.kw).concat([flaw, compensation]), kw => kw.category !== 'Flaw');
                            
                            keywordList.push({ kw: flaw, role: 'Flaw' });
                            keywordList.push({ kw: compensation, role: 'Compensation' });
                            keywordList.push({ kw: bonus, role: 'Bonus' });
                        }
                    } else {
                        let role = (i === 0) ? 'Seed' : 'Normal';
                        keywordList.push({ kw: newKeyword, role: role });
                    }
                }

                let statPointsToDistribute = 0;
                if (level >= 1) {
                    Object.keys(stats).forEach(key => stats[key] = 2);
                }
                for (let i = 2; i <= level; i++) {
                    statPointsToDistribute += statPointGains[i];
                }

                const priorityStats = [colorToStat[profile.goal.color], colorToStat[profile.method.color], colorToStat[profile.purpose.color]].filter(s => s);
                for (let i = 0; i < statPointsToDistribute; i++) {
                    const statToBuff = (i < priorityStats.length && stats[priorityStats[i]] < 5) ? priorityStats[i] : getRandomElement(statNames);
                    if (stats[statToBuff] < 5) {
                        stats[statToBuff]++;
                    } else {
                        i--;
                    }
                }

                const sortedStats = Object.values(stats).sort((a, b) => b - a);
                const resistance = sortedStats[0] + sortedStats[1] + sortedStats[2];

                let html = `<div class="entity-block">`;
                html += `<strong>ENTITY TYPE:</strong> Character\n`;
                html += `<strong>LEVEL:</strong> ${level}\n\n`;
                html += `<strong>STATS:</strong>\n`;
                html += `  M: ${stats.M} | A: ${stats.A} | B: ${stats.B}\n`;
                html += `  W: ${stats.W} | E: ${stats.E} | T: ${stats.T}\n`;
                html += `  P: ${stats.P} | I: ${stats.I} | F: ${stats.F}\n\n`;
                html += `<strong>RESISTANCE:</strong> ${resistance}\n`;
                html += `<strong>HP/SP/EP:</strong> 10 / 10 / 10\n\n`;
                html += `<strong>KEYWORDS (${keywordList.length} total):</strong>\n`;
                keywordList.forEach(item => {
                    const kw = item.kw;
                    let lineClass = '';
                    let tag = '';
                    switch(item.role) {
                        case 'Flaw': lineClass = 'class="flaw-keyword"'; tag = '<span class="keyword-tag">(Flaw)</span>'; break;
                        case 'Compensation': lineClass = 'class="compensation-keyword"'; tag = '<span class="keyword-tag">(Compensation)</span>'; break;
                        case 'Bonus': tag = '<span class="keyword-tag">(Bonus)</span>'; break;
                        case 'Seed': tag = '<span class="keyword-tag">(Seed)</span>'; break;
                    }
                    html += `  - <span ${lineClass}><code>${kw.id}</code> ${kw.name} <span class="keyword-meta">(${kw.color} / ${kw.category})</span> ${tag}</span>\n`;
                });
                html += generateProfileHTML(profile);
                html += `</div>`;
                return html;
            }

            function generateAnimation(level, seedId = 'random', isNPC = false) {
                const profile = generateMotivationalProfile();
                const primaryColor = profile.goal.color;
                let stats = { M: 1, A: 1, B: 1, W: 1, E: 1, T: 1, P: 1, I: 1, F: 1 };
                let keywords = [];
                
                let seed;
                if (seedId !== 'random') {
                    seed = findKeyword(seedId);
                } else {
                    const thematicKeywords = keywordsData.filter(kw => kw.color === primaryColor && kw.category !== 'Flaw');
                    seed = (thematicKeywords.length > 0) ? getRandomElement(thematicKeywords) : getRandomKeyword([], kw => kw.category !== 'Flaw');
                }
                keywords.push(seed);

                for (let i = 0; i < level; i++) {
                    keywords.push(getRandomKeyword(keywords, kw => kw.category !== 'Flaw'));
                }

                let statPointsToDistribute = level;
                const priorityStats = [colorToStat[profile.goal.color], colorToStat[profile.method.color], colorToStat[profile.purpose.color]].filter(s => s);
                for (let i = 0; i < statPointsToDistribute; i++) {
                    const statToBuff = (i < priorityStats.length && stats[priorityStats[i]] < 5) ? priorityStats[i] : getRandomElement(statNames);
                    if (stats[statToBuff] < 5) {
                        stats[statToBuff]++;
                    } else {
                        i--;
                    }
                }

                const sortedStats = Object.values(stats).sort((a, b) => b - a);
                const resistance = sortedStats[0] + sortedStats[1] + sortedStats[2];

                let html = `<div class="entity-block">`;
                html += `<strong>ENTITY TYPE:</strong> Animation\n`;
                html += `<strong>LEVEL:</strong> ${level}\n\n`;
                html += `<strong>STATS:</strong>\n`;
                html += `  M: ${stats.M} | A: ${stats.A} | B: ${stats.B}\n`;
                html += `  W: ${stats.W} | E: ${stats.E} | T: ${stats.T}\n`;
                html += `  P: ${stats.P} | I: ${stats.I} | F: ${stats.F}\n\n`;
                html += `<strong>RESISTANCE:</strong> ${resistance}\n`;
                html += `<strong>HP/SP/EP:</strong> 10 / 10 / 10\n\n`;
                html += `<strong>KEYWORDS (${keywords.length} total):</strong>\n`;
                keywords.forEach((kw, index) => {
                    let tag = (index === 0) ? "(Seed)" : "";
                    html += `  - <code>${kw.id}</code> ${kw.name} <span class="keyword-meta">(${kw.color} / ${kw.category})</span> ${tag}\n`;
                });
                html += generateProfileHTML(profile);
                html += `</div>`;
                return html;
            }

            function generateItem(level) {
                let keywords = [];
                let deadSlots = 0;
                let totalSlots = Math.min(level + 1, 5);
                let hasFlaw = false;

                for (let i = 0; i < totalSlots; i++) {
                    const newKeyword = getRandomKeyword(keywords);
                    if (newKeyword.category === 'Flaw') {
                        if (hasFlaw) {
                            deadSlots++;
                        } else {
                            hasFlaw = true;
                            keywords.push(newKeyword);
                        }
                    } else {
                        keywords.push(newKeyword);
                    }
                }

                let html = `<div class="entity-block">`;
                html += `<strong>ENTITY TYPE:</strong> Item\n`;
                html += `<strong>LEVEL:</strong> ${level}\n\n`;
                html += `<strong>DURABILITY CLOCK:</strong> [ ] [ ] (Undamaged)\n\n`;
                html += `<strong>KEYWORDS (${keywords.length} active):</strong>\n`;
                keywords.forEach(kw => {
                    let lineClass = (kw.category === 'Flaw') ? 'class="flaw-keyword"' : '';
                    let tag = (kw.category === 'Flaw') ? '<span class="keyword-tag">(Flaw)</span>' : '';
                    html += `  - <span ${lineClass}><code>${kw.id}</code> ${kw.name} <span class="keyword-meta">(${kw.color} / ${kw.category})</span> ${tag}</span>\n`;
                });
                if (deadSlots > 0) {
                    html += `\n<strong>DEAD SLOTS:</strong> ${deadSlots} (Due to Collapse Protocol)\n`;
                }
                html += `</div>`;
                return html;
            }
            
            function generateBarrier(level) {
                const tn = 10 + level;
                let clockSize;
                if (level <= 1) clockSize = getRandomInt(3, 4);
                else if (level <= 4) clockSize = getRandomInt(5, 7);
                else if (level <= 7) clockSize = getRandomInt(8, 10);
                else clockSize = getRandomInt(11, 14);
                
                let html = `<div class="entity-block">`;
                html += `<strong>CHALLENGE TYPE:</strong> Barrier\n`;
                html += `<strong>LEVEL:</strong> ${level}\n`;
                html += `<strong>TARGET NUMBER (TN):</strong> ${tn}\n`;
                html += `<strong>TASK CLOCK:</strong> ${clockSize}\n`;
                html += `</div>`;
                return html;
            }

            function generatePuzzle(level) {
                const tn = 12 + level;
                let html = `<div class="entity-block">`;
                html += `<strong>CHALLENGE TYPE:</strong> Puzzle\n`;
                html += `<strong>LEVEL:</strong> ${level}\n`;
                html += `<strong>TARGET NUMBER (TN):</strong> ${tn}\n`;
                html += `(Binary: Solved or Unsolved)\n`;
                html += `</div>`;
                return html;
            }

        });
    </script>

</body>
