<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychromattica Curator Dashboard</title>
    <style>
        :root {
            --color-null: #dea193; --color-silver: #a7a9ac; --color-yellow: #f5d36c;
            --color-green: #688d4c; --color-black: #414042; --color-orange: #f7855d;
            --color-white: #e3e1da; --color-red: #a95b5a; --color-blue: #88bfe8;
            --color-purple: #957fa3; --color-background: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--color-background); color: var(--color-white); font-family: Calibri, sans-serif; font-size: 12pt; padding: 10px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        h2, h3 { font-weight: normal; font-family: 'Oswald', sans-serif; color: var(--color-null); }
        h3 { color: var(--color-silver); margin-top: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .section { border: 1px solid var(--color-black); background-color: #2a2a2a; padding: 20px; border-radius: 3px; }
        button { background-color: var(--color-black); color: var(--color-white); border: 1px solid var(--color-silver); padding: 8px 12px; font-family: Calibri, sans-serif; font-size: 10pt; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
        button:hover:not(:disabled) { background-color: var(--color-silver); color: var(--color-black); }
        button:disabled { background-color: #1a1a1a; color: #555; border-color: #444; cursor: not-allowed; }
        .button-small { padding: 4px 8px; font-size: 9pt; }
        .remove-button { background-color: var(--color-red); }
        input[type="text"], input[type="number"] { background-color: #333; border: 1px solid var(--color-silver); color: var(--color-white); padding: 8px; font-family: Calibri, sans-serif; width: 100%; border-radius: 2px; }
        label { font-size: 10pt; color: var(--color-silver); display: block; margin-top: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .card { background-color: #333; padding: 15px; border-radius: 2px; margin-top: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 15px; }
        .card-header input[type="text"] { font-size: 1.1em; font-weight: bold; background: none; border: none; border-bottom: 1px solid #555; padding: 4px; }
        .entity-card { border-left: 3px solid var(--color-yellow); }
        .barrier-card { border-left: 3px solid var(--color-blue); }
        .clock-pips { display: flex; gap: 3px; height: 20px; flex-wrap: wrap; }
        .pip { flex-grow: 1; min-width: 5px; border: 1px solid var(--color-silver); cursor: pointer; border-radius: 1px; transition: background-color 0.1s; }
        .pip.active { background-color: var(--color-silver); }
        .clock { margin-bottom: 10px; }
        .clock-header { display: flex; justify-content: space-between; align-items: center; font-size: 10pt; margin-bottom: 5px; }
        .clock-header input[type="number"] { width: 50px; padding: 2px 5px; text-align: center; }
        .hp-pips .pip.active { background-color: var(--color-green); }
        .sp-pips .pip.active { background-color: var(--color-orange); }
        .ep-pips .pip.active { background-color: var(--color-purple); }
        .threat-pips .pip.active { background-color: var(--color-red); }
        #initiative-tracker .grid-3 { text-align: center; }
        .initiative-list { background-color: #1a1a1a; min-height: 100px; padding: 10px; border-radius: 3px; }
        .initiative-card { background-color: var(--color-black); color: var(--color-silver); padding: 5px 8px; border-radius: 2px; margin-bottom: 5px; font-size: 10pt; cursor: pointer; }
        .initiative-card:hover { background-color: #444; }
        #current-turn-card { background-color: var(--color-yellow); color: var(--color-black); font-weight: bold; font-size: 1.3em; padding: 15px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .manual-add-combatant { display: flex; gap: 10px; margin-top: 10px; }
        .stat-input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .stat-input-grid label { font-size: 8pt; margin: 0; text-align: center; }
        .stat-input-grid input { padding: 4px; text-align: center; }
        .entity-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center;}
        .action-pool { display: flex; align-items: center; gap: 5px; justify-content: center; }
        .action-pool button { padding: 2px 8px; font-size: 12pt; line-height: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h2>Scene Clocks</h2>
            <div class="grid-2">
                <div><div class="clock"><div class="clock-header"><span>Situation Clock</span><span><span id="situation-value">0/0</span> Max: <input type="number" id="situation-max" value="0" min="0"></span></div><div class="clock-pips" id="situation-pips"></div></div></div>
                <div><div class="clock"><div class="clock-header"><span>Threat Clock</span><span><span id="threat-value">0/10</span> Max: <input type="number" id="threat-max" value="10" min="1"></span></div><div class="clock-pips threat-pips" id="threat-pips"></div></div></div>
            </div>
        </div>
        <div class="section" id="initiative-tracker">
            <h2>Initiative Tracker</h2>
            <div class="grid-3">
                <div><h3>Deck (<span id="deck-count">0</span>)</h3><div class="initiative-list" id="deck-list"></div></div>
                <div><h3>Current Turn</h3><div id="current-turn-card"></div></div>
                <div><h3>Discard (<span id="discard-count">0</span>)</h3><div class="initiative-list" id="discard-list"></div></div>
            </div>
            <div class="grid-3" style="margin-top: 15px;">
                <button id="start-combat-button">Start Round</button>
                <button id="draw-card-button" disabled>Draw Next Card</button>
                <button id="pass-turn-button" disabled title="End current turn. Moves card to bottom of deck if actions remain, otherwise to discard.">Pass Turn</button>
            </div>
             <div class="manual-add-combatant">
                <input type="text" id="manual-combatant-name" placeholder="Add combatant (e.g. PC name)...">
                <button id="add-manual-combatant-button" style="margin-top:0;">Add to Discard</button>
                <button id="add-mid-round-button" style="margin-top:0;" title="Add the combatant and shuffle them into the remaining deck.">Enter Mid-Round</button>
            </div>
            <div style="margin-top: 10px;">
                <button id="seize-priority-button" class="button-small" disabled title="Select a card from the Deck or Discard, then click here to make it the current turn.">Seize Priority</button>
            </div>
        </div>
        <div class="grid-2">
            <div class="section">
                <h2>Barriers & Puzzles</h2>
                <div id="barriers-container"></div>
                <button id="add-barrier-button">Add Task</button>
            </div>
            <div class="section">
                <h2>Entities</h2>
                <div id="entities-container"></div>
                <button id="add-entity-button">Add Entity</button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STAT_NAMES = ['M', 'A', 'B', 'W', 'E', 'T', 'P', 'I', 'F'];
            let entityCounter = 0;
            let barrierCounter = 0;
            const combatants = new Map();
            const initiativeState = { deck: [], discard: [], current: null, selected: null };

            function setupClock(prefix) {
                const maxInput = document.getElementById(`${prefix}-max`);
                const pipsContainer = document.getElementById(`${prefix}-pips`);
                const valueDisplay = document.getElementById(`${prefix}-value`);
                
                function redrawPips() {
                    let max = parseInt(maxInput.value) || 0;
                    let current = pipsContainer.querySelectorAll('.pip.active').length;
                    if (pipsContainer.children.length === 0) current = max;
                    pipsContainer.innerHTML = '';
                    for (let i = 0; i < max; i++) {
                        const pip = document.createElement('div');
                        pip.className = i < current ? 'pip active' : 'pip';
                        pip.dataset.index = i;
                        pipsContainer.appendChild(pip);
                    }
                    updateClockValue();
                }

                function updateClockValue() {
                    let max = parseInt(maxInput.value) || 0;
                    const current = pipsContainer.querySelectorAll('.pip.active').length;
                    if(valueDisplay) valueDisplay.textContent = `${current}/${max}`;
                }

                pipsContainer.addEventListener('click', e => {
                    if (e.target.classList.contains('pip')) {
                        const targetIndex = parseInt(e.target.dataset.index);
                        const pips = Array.from(pipsContainer.children);
                        const currentActive = pips.filter(p => p.classList.contains('active')).length;
                        let newActive = (currentActive === targetIndex + 1 && targetIndex === currentActive - 1) ? targetIndex : targetIndex + 1;
                        pips.forEach((pip, i) => pip.classList.toggle('active', i < newActive));
                        updateClockValue();
                    }
                });
                maxInput.addEventListener('change', redrawPips);
                redrawPips();
            }
            
            const startCombatBtn = document.getElementById('start-combat-button');
            const drawCardBtn = document.getElementById('draw-card-button');
            const passTurnBtn = document.getElementById('pass-turn-button');
            const seizePriorityBtn = document.getElementById('seize-priority-button');

            function renderInitiative() {
                ['deck', 'discard'].forEach(pile => {
                    const listEl = document.getElementById(`${pile}-list`);
                    listEl.innerHTML = '';
                    initiativeState[pile].forEach(name => {
                        const card = document.createElement('div');
                        card.className = 'initiative-card';
                        card.textContent = name;
                        if (name === initiativeState.selected) card.style.backgroundColor = 'var(--color-blue)';
                        card.onclick = () => { initiativeState.selected = name; renderInitiative(); };
                        listEl.appendChild(card);
                    });
                    document.getElementById(`${pile}-count`).textContent = initiativeState[pile].length;
                });
                document.getElementById('current-turn-card').textContent = initiativeState.current || '';
                const hasDeck = initiativeState.deck.length > 0;
                const inCombat = !!initiativeState.current || hasDeck || initiativeState.discard.length > 0;
                drawCardBtn.disabled = !hasDeck || !inCombat;
                passTurnBtn.disabled = !initiativeState.current;
                seizePriorityBtn.disabled = !initiativeState.current || !initiativeState.selected;
                startCombatBtn.disabled = hasDeck;
                startCombatBtn.textContent = (!hasDeck && inCombat) ? "Next Round" : "Start Round";
            }

            startCombatBtn.addEventListener('click', () => {
                const allNames = Array.from(combatants.keys());
                if (initiativeState.current) initiativeState.discard.push(initiativeState.current);
                initiativeState.deck = allNames.filter(name => !initiativeState.discard.includes(name) && initiativeState.current !== name);
                initiativeState.deck.push(...initiativeState.discard);
                initiativeState.discard = [];
                initiativeState.current = null;
                initiativeState.selected = null;
                shuffleArray(initiativeState.deck);
                combatants.forEach(data => { if (data.isEntity) data.actions.current = data.actions.max; });
                renderAllEntityActions();
                renderInitiative();
            });

            drawCardBtn.addEventListener('click', () => {
                if (initiativeState.deck.length === 0) return;
                if (initiativeState.current) initiativeState.discard.push(initiativeState.current);
                initiativeState.current = initiativeState.deck.shift();
                renderInitiative();
            });

            passTurnBtn.addEventListener('click', () => {
                if (!initiativeState.current) return;
                const combatant = combatants.get(initiativeState.current);
                const hasActionsRemaining = combatant && combatant.isEntity && combatant.actions.current > 0;
                if (hasActionsRemaining && initiativeState.deck.length > 0) {
                    initiativeState.deck.push(initiativeState.current);
                } else {
                    initiativeState.discard.push(initiativeState.current);
                }
                initiativeState.current = null;
                renderInitiative();
            });

            seizePriorityBtn.addEventListener('click', () => {
                if (!initiativeState.selected || !initiativeState.current) return;
                initiativeState.deck.unshift(initiativeState.current);
                initiativeState.deck = initiativeState.deck.filter(c => c !== initiativeState.selected);
                initiativeState.discard = initiativeState.discard.filter(c => c !== initiativeState.selected);
                initiativeState.current = initiativeState.selected;
                initiativeState.selected = null;
                renderInitiative();
            });

            document.getElementById('add-manual-combatant-button').addEventListener('click', () => addCombatant(false));
            document.getElementById('add-mid-round-button').addEventListener('click', () => addCombatant(true));
            
            function addCombatant(midRound = false) {
                 const nameInput = document.getElementById('manual-combatant-name');
                 const name = nameInput.value.trim();
                 if (!name) return;
                 if (combatants.has(name) || initiativeState.deck.includes(name) || initiativeState.discard.includes(name)) {
                     return alert("A combatant with that name already exists in the tracker.");
                 }
                 if(midRound && initiativeState.deck.length > 0) {
                     initiativeState.deck.push(name);
                     shuffleArray(initiativeState.deck);
                 } else {
                     initiativeState.discard.push(name);
                 }
                 if (!combatants.has(name)) combatants.set(name, { isEntity: false, actions: { max: 2, current: 2 } });
                 nameInput.value = '';
                 renderInitiative();
            }

            function addEntity() {
                let entityName = `Entity ${++entityCounter}`;
                while (combatants.has(entityName)) {
                    entityName = `Entity ${++entityCounter}`;
                }
                const card = document.createElement('div');
                card.className = 'card entity-card';
                const idPrefix = `entity-${entityCounter}`;
                card.dataset.name = entityName;
                card.id = idPrefix;
                card.innerHTML = `<div class="card-header"><input type="text" value="${entityName}" class="entity-name-input"><button class="remove-button button-small">Remove</button></div><div class="entity-info-grid"><div><div class="stat-input-grid">${STAT_NAMES.map(stat => `<div><label>${stat}</label><input type="number" class="stat-input" data-stat="${stat}" value="${stat === 'A' ? 2 : 1}"></div>`).join('')}</div><label>Resistance: <span class="resistance-value">4</span></label></div><div><label>Action Pool</label><div class="action-pool"><button class="action-minus">-</button><span class="action-current">2</span> / <span class="action-max">2</span><button class="action-plus">+</button></div></div></div><hr style="margin: 10px 0;"><div class="clock"><div class="clock-header"><span>HP</span><span><span id="${idPrefix}-hp-value">0/10</span> Max: <input type="number" id="${idPrefix}-hp-max" value="10" min="1"></span></div><div class="clock-pips hp-pips" id="${idPrefix}-hp-pips"></div></div><div class="clock"><div class="clock-header"><span>SP</span><span><span id="${idPrefix}-sp-value">0/10</span> Max: <input type="number" id="${idPrefix}-sp-max" value="10" min="1"></span></div><div class="clock-pips sp-pips" id="${idPrefix}-sp-pips"></div></div><div class="clock"><div class="clock-header"><span>EP</span><span><span id="${idPrefix}-ep-value">0/10</span> Max: <input type="number" id="${idPrefix}-ep-max" value="10" min="1"></span></div><div class="clock-pips ep-pips" id="${idPrefix}-ep-pips"></div></div>`;
                document.getElementById('entities-container').appendChild(card);
                const stats = {};
                card.querySelectorAll('.stat-input').forEach(input => stats[input.dataset.stat] = parseInt(input.value));
                combatants.set(entityName, { isEntity: true, element: card, stats: stats, actions: { max: stats.A, current: stats.A } });
                initiativeState.discard.push(entityName);
                updateSituationClockMax();
                renderInitiative();
                ['hp', 'sp', 'ep'].forEach(c => setupClock(`${idPrefix}-${c}`));
            }

            function addBarrier() {
                barrierCounter++;
                const card = document.createElement('div');
                card.className = 'card barrier-card';
                card.innerHTML = `<div class="card-header"><input type="text" value="Task ${barrierCounter}" placeholder="Barrier/Puzzle Name..."><button class="remove-button button-small">Remove</button></div><div class="clock"><div class="clock-header"><span>Task Clock</span><span><span id="barrier-${barrierCounter}-value">0/6</span> Max: <input type="number" id="barrier-${barrierCounter}-max" value="6" min="1"></span></div><div class="clock-pips" id="barrier-${barrierCounter}-pips"></div></div>`;
                document.getElementById('barriers-container').appendChild(card);
                updateSituationClockMax();
                setupClock(`barrier-${barrierCounter}`);
            }
            
            function updateSituationClockMax() {
                const count = document.getElementById('entities-container').children.length + document.getElementById('barriers-container').children.length;
                const clockInput = document.getElementById('situation-max');
                clockInput.value = count;
                clockInput.dispatchEvent(new Event('change'));
            }

            document.body.addEventListener('change', e => {
                if(e.target.classList.contains('entity-name-input')) {
                    const card = e.target.closest('.card'); const oldName = card.dataset.name; const newName = e.target.value.trim();
                    if (combatants.has(newName) && oldName !== newName) { e.target.value = oldName; return alert("A combatant with that name already exists."); }
                    const data = combatants.get(oldName); combatants.delete(oldName); combatants.set(newName, data);
                    card.dataset.name = newName;
                    ['deck', 'discard'].forEach(p => initiativeState[p] = initiativeState[p].map(n => n === oldName ? newName : n));
                    if(initiativeState.current === oldName) initiativeState.current = newName;
                    renderInitiative();
                }
                if(e.target.classList.contains('stat-input')) {
                     const card = e.target.closest('.card'); const name = card.dataset.name; const combatant = combatants.get(name);
                     if(combatant) {
                        const newStats = {};
                        card.querySelectorAll('.stat-input').forEach(input => newStats[input.dataset.stat] = parseInt(input.value) || 0);
                        combatant.stats = newStats;
                        const sortedStats = Object.values(newStats).sort((a,b)=>b-a);
                        card.querySelector('.resistance-value').textContent = sortedStats.slice(0,3).reduce((a,b)=>a+b, 0);
                        combatant.actions.max = newStats.A;
                        combatant.actions.current = Math.min(combatant.actions.current, newStats.A);
                        renderEntityActions(name);
                     }
                }
            });
            
             document.body.addEventListener('click', e => {
                if (e.target.classList.contains('remove-button')) {
                    const card = e.target.closest('.card');
                    if (card.classList.contains('entity-card')) {
                         const nameToRemove = card.dataset.name;
                         combatants.delete(nameToRemove);
                         ['deck', 'discard'].forEach(p => initiativeState[p] = initiativeState[p].filter(n => n !== nameToRemove));
                         if(initiativeState.current === nameToRemove) initiativeState.current = null;
                    }
                    card.remove(); updateSituationClockMax(); renderInitiative();
                }
                 if (e.target.classList.contains('action-minus') || e.target.classList.contains('action-plus')) {
                    const card = e.target.closest('.card'); const name = card.dataset.name; const combatant = combatants.get(name);
                    if(combatant) {
                        if(e.target.classList.contains('action-minus')) combatant.actions.current = Math.max(0, combatant.actions.current - 1);
                        else combatant.actions.current = Math.min(combatant.actions.max, combatant.actions.current + 1);
                        renderEntityActions(name);
                    }
                 }
            });
            
            function renderAllEntityActions(){ combatants.forEach((data, name) => { if(data.isEntity) renderEntityActions(name); }); }
            function renderEntityActions(name) {
                const combatant = combatants.get(name);
                if (!combatant || !combatant.isEntity) return;
                combatant.element.querySelector('.action-current').textContent = combatant.actions.current;
                combatant.element.querySelector('.action-max').textContent = combatant.actions.max;
            }
            function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

            setupClock('situation'); setupClock('threat');
            document.getElementById('add-entity-button').addEventListener('click', addEntity);
            document.getElementById('add-barrier-button').addEventListener('click', addBarrier);
            
            addEntity();
            addBarrier();
        });
    </script>
</body>
</html>
