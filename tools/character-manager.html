<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Digital Character Sheet</title>
    <style>
        :root {
            --null-color: #dea193;
            --silver-color: #a7a9ac;
            --yellow-color: #f5d36c;
            --green-color: #688d4c;
            --black-color: #414042;
            --orange-color: #f7855d;
            --white-color: #e3e1da;
            --red-color: #a95b5a;
            --blue-color: #88bfe8;
            --purple-color: #957fa3;
            --bg-color: #2a2a2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Calibri, sans-serif;
            font-size: 11pt;
            background-color: var(--bg-color);
            color: var(--white-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .container {
            border: 1px solid var(--silver-color);
            padding: 10px;
            background-color: var(--black-color);
            border-bottom: 3px double var(--silver-color);
        }

        h1, h2, h3 {
            font-weight: normal;
            border-bottom: 1px solid var(--silver-color);
            margin-bottom: 8px;
            padding-bottom: 4px;
            color: var(--null-color);
        }
        
        h2 { font-size: 1.2em; color: var(--blue-color); }
        h3 { font-size: 1.1em; border-bottom-style: dotted; margin-top: 10px; }
        h4 { font-weight: normal; font-size: 1em; margin-top: 8px; color: var(--silver-color); }

        .entity-name-input {
            background: transparent;
            border: none;
            color: var(--white-color);
            font-family: Calibri, sans-serif;
            padding: 0;
            width: 100%;
        }
        .entity-name-input:focus {
            outline: none;
            background-color: var(--bg-color);
            border-bottom: 1px dotted var(--silver-color);
        }
        #character-name-input {
            font-size: 1.2em;
            color: var(--blue-color);
            flex-grow: 1;
        }
        .animation-header .entity-name-input {
            font-size: 1.1em;
            color: var(--null-color);
        }
        .item .entity-name-input {
            font-size: 10pt;
            font-weight: bold;
            width: 120px;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 10pt;
        }
        .profile-entry {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .profile-role {
            color: var(--silver-color);
            margin-right: 10px;
        }
        .profile-motivation {
            font-weight: bold;
            text-align: right;
        }

        .input-section { display: flex; flex-direction: column; gap: 8px; }
        #blueprint-input {
            width: 100%; padding: 8px; font-family: monospace; font-size: 10pt;
            background-color: var(--bg-color); color: var(--blue-color);
            border: 1px solid var(--silver-color); resize: vertical;
        }
        #load-button {
            padding: 8px 12px; font-family: Calibri, sans-serif; font-size: 11pt;
            background-color: var(--null-color); color: var(--black-color);
            border: 1px solid var(--silver-color); cursor: pointer; align-self: flex-start;
        }
        #load-button:hover { background-color: var(--white-color); }

        #character-sheet { display: none; gap: 15px; flex-direction: column; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .column { display: flex; flex-direction: column; gap: 15px; }

        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; margin-top: 8px;}
        .stat-box { border: 1px solid var(--silver-color); padding: 5px; }
        .stat-name { font-size: 8pt; color: var(--silver-color); }
        .stat-value { font-size: 12pt; font-weight: bold; }

        .core-stats-display { display: flex; justify-content: space-around; text-align: center; gap: 10px; }
        
        .resource-clocks-container { display: flex; flex-direction: column; gap: 8px; }
        .clock-component { display: flex; align-items: center; gap: 8px; }
        .clock-label { font-size: 10pt; font-weight: bold; width: 25px; }
        .pip-container { display: flex; flex-wrap: wrap; gap: 3px; flex-grow: 1; }
        .pip {
            width: 10px; height: 10px; border: 1px solid var(--silver-color);
            border-radius: 50%; cursor: pointer;
        }
        .hp-pips .pip.filled { background-color: var(--green-color); border-color: var(--green-color); }
        .sp-pips .pip.filled { background-color: var(--orange-color); border-color: var(--orange-color); }
        .ep-pips .pip.filled { background-color: var(--purple-color); border-color: var(--purple-color); }
        .clock-max-input {
            width: 40px; text-align: center; background-color: var(--bg-color);
            color: var(--white-color); border: 1px solid var(--silver-color); padding: 2px;
        }
        
        .karma-tracker { display: flex; align-items: center; justify-content: space-around; }
        #karma-value { font-size: 14pt; color: var(--null-color); min-width: 30px; }
        .karma-btn {
            width: 25px; height: 25px; background: none; border: 1px solid var(--null-color);
            color: var(--null-color); cursor: pointer; font-size: 12pt;
        }

        .tag-manager { display: flex; flex-direction: column; gap: 10px; }
        .tag-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .tag-entry { display: flex; justify-content: space-between; align-items: center; font-size: 10pt; }
        .tag-quantity {
            width: 40px; text-align: center; background-color: var(--bg-color);
            border: 1px solid; color: var(--white-color); padding: 1px; margin-left: 5px;
        }

        .keyword-list { list-style-type: none; }
        .keyword-item { padding: 2px 0; font-size: 10pt; display: flex; }
        .keyword-passive-icon { color: var(--yellow-color); width: 12px; display: inline-block; }
        .keyword-name { font-weight: bold; }
        .keyword-intent { margin-left: 8px; color: var(--silver-color); font-style: italic; }

        .entity-list { display: flex; flex-direction: column; gap: 10px; }
        .item-list { list-style-type: none; padding-left: 10px; }
        .item { font-size: 10pt; display: flex; align-items: baseline; gap: 5px;}
        .item-keywords { font-style: italic; color: var(--silver-color); }
        
        .animation-card { border: 1px solid var(--silver-color); padding: 8px; }
        .animation-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--null-color); padding-bottom: 4px; margin-bottom: 8px;}

        .faction-display { border: 1px solid var(--silver-color); padding: 8px; font-size: 10pt; }
        .faction-name { font-weight: bold; }
        
        /* Color Utility Classes */
        .color-Null { color: var(--null-color); } .color-Silver { color: var(--silver-color); } .color-Yellow { color: var(--yellow-color); } .color-Green { color: var(--green-color); } 
        .color-Orange { color: var(--orange-color); } .color-White { color: var(--white-color); } .color-Red { color: var(--red-color); } .color-Blue { color: var(--blue-color); } .color-Purple { color: var(--purple-color); }
        
        /* THE FIX: Added text-shadow to make black text readable on the black card background */
        .color-Black { 
            color: var(--black-color); 
            text-shadow: 0px 0px 4px var(--silver-color);
        }
        
        .border-Null { border-color: var(--null-color); color: var(--null-color); } .border-Silver { border-color: var(--silver-color); color: var(--silver-color); } .border-Yellow { border-color: var(--yellow-color); color: var(--yellow-color); } .border-Green { border-color: var(--green-color); color: var(--green-color); } .border-Black { border-color: var(--black-color); color: var(--black-color); } .border-Orange { border-color: var(--orange-color); color: var(--orange-color); } .border-White { border-color: var(--white-color); color: var(--white-color); } .border-Red { border-color: var(--red-color); color: var(--red-color); } .border-Blue { border-color: var(--blue-color); color: var(--blue-color); } .border-Purple { border-color: var(--purple-color); color: var(--purple-color); }
    </style>
</head>
<body>

    <div class="container input-section">
        <h1>Resonance Blueprint Loader</h1>
        <textarea id="blueprint-input" rows="4" placeholder="Paste your character ecosystem blueprint string here... e.g., C:329-31-32.33.34-21.22.B@A:11/I:L1-12"></textarea>

    <div id="character-sheet">
        <div class="main-layout">
            <div class="column">

                 <div class="container">

<script>
// --- CORE GAME DATA ---
const KEYWORD_DATA = { '00':{n:"Restricted",c:"Null"},'01':{n:"Aura",c:"Null"},'02':{n:"Specialist",c:"Null"},'03':{n:"Alert",c:"Null"},'04':{n:"Liberate",c:"Null"},'05':{n:"Mark",c:"Null"},'06':{n:"Indirect",c:"Null"},'07':{n:"Adaptive",c:"Null"},'08':{n:"Gamble",c:"Null"},'09':{n:"Edit",c:"Null"},'10':{n:"Bane",c:"Silver"},'11':{n:"Traveller",c:"Silver"},'12':{n:"Martial",c:"Silver"},'13':{n:"Attuned",c:"Silver"},'14':{n:"Augment",c:"Silver"},'15':{n:"Impair",c:"Silver"},'16':{n:"Reactive",c:"Silver"},'17':{n:"Phasing",c:"Silver"},'18':{n:"Brutal",c:"Silver"},'19':{n:"Translocate",c:"Silver"},'20':{n:"Anxious",c:"Yellow"},'21':{n:"Acrobatic",c:"Yellow"},'22':{n:"Sentry",c:"Yellow"},'23':{n:"Eidetic",c:"Yellow"},'24':{n:"Haste",c:"Yellow"},'25':{n:"Slow",c:"Yellow"},'26':{n:"Snap",c:"Yellow"},'27':{n:"Condense",c:"Yellow"},'28':{n:"Rapid",c:"Yellow"},'29':{n:"Reckless",c:"Yellow"},'30':{n:"Hesitant",c:"Green"},'31':{n:"Sturdy",c:"Green"},'32':{n:"Brawler",c:"Green"},'33':{n:"Stubborn",c:"Green"},'34':{n:"Ward",c:"Green"},'35':{n:"Daze",c:"Green"},'36':{n:"Sculpt",c:"Green"},'37':{n:"Defensive",c:"Green"},'38':{n:"Impact",c:"Green"},'39':{n:"Shift",c:"Green"},'40':{n:"Feeble",c:"Black"},'41':{n:"Survivor",c:"Black"},'42':{n:"Stoic",c:"Black"},'43':{n:"Ageless",c:"Black"},'44':{n:"Bless",c:"Black"},'45':{n:"Curse",c:"Black"},'46':{n:"Piercing",c:"Black"},'47':{n:"Flux",c:"Black"},'48':{n:"Siphon",c:"Black"},'49':{n:"Animate",c:"Black"},'50':{n:"Gremlins",c:"Orange"},'51':{n:"Sensor",c:"Orange"},'52':{n:"Improvisor",c:"Orange"},'53':{n:"Crafty",c:"Orange"},'54':{n:"Charge",c:"Orange"},'55':{n:"Bind",c:"Orange"},'56':{n:"Imbue",c:"Orange"},'57':{n:"Material",c:"Orange"},'58':{n:"Leverage",c:"Orange"},'59':{n:"Manifest",c:"Orange"},'60':{n:"Vulnerable",c:"White"},'61':{n:"Tolerant",c:"White"},'62':{n:"Deadeye",c:"White"},'63':{n:"Immunized",c:"White"},'64':{n:"Cure",c:"White"},'65':{n:"Weaken",c:"White"},'66':{n:"Sticky",c:"White"},'67':{n:"Restore",c:"White"},'68':{n:"Exploit",c:"White"},'69':{n:"Growth",c:"White"},'70':{n:"Limited",c:"Red"},'71':{n:"Resilient",c:"Red"},'72':{n:"Font",c:"Red"},'73':{n:"Insulated",c:"Red"},'74':{n:"Regen",c:"Red"},'75':{n:"Blight",c:"Red"},'76':{n:"Area",c:"Red"},'77':{n:"Ranged",c:"Red"},'78':{n:"Multiply",c:"Red"},'79':{n:"Split",c:"Red"},'80':{n:"Awkward",c:"Blue"},'81':{n:"Charismatic",c:"Blue"},'82':{n:"Leader",c:"Blue"},'83':{n:"Insightful",c:"Blue"},'84':{n:"Enhance",c:"Blue"},'85':{n:"Silence",c:"Blue"},'86':{n:"Splash",c:"Blue"},'87':{n:"Lingering",c:"Blue"},'88':{n:"Spread",c:"Blue"},'89':{n:"Potent",c:"Blue"},'90':{n:"Mundane",c:"Purple"},'91':{n:"Aware",c:"Purple"},'92':{n:"Stealthy",c:"Purple"},'93':{n:"Trickster",c:"Purple"},'94':{n:"Obscure",c:"Purple"},'95':{n:"Nullify",c:"Purple"},'96':{n:"Chain",c:"Purple"},'97':{n:"Natural",c:"Purple"},'98':{n:"Ambience",c:"Purple"},'99':{n:"Channel",c:"Purple"} };
const STAT_MAP = { M: 'Movement', A: 'Alacrity', B: 'Brawn', W: 'Wit', E: 'Expertise', T: 'Technique', P: 'Power', I: 'Influence', F: 'Force' };
const STAT_ORDER = ['M', 'A', 'B', 'W', 'E', 'T', 'P', 'I', 'F'];
const MOTIVATION_MAP = { '0': 'Discovery', '1': 'Absolution', '2': 'Ambition', '3': 'Security', '4': 'Legacy', '5': 'Innovation', '6': 'Purity', '7': 'Glory', '8': 'Influence', '9': 'Faith' };
const MOTIVATION_COLORS = { '0': 'Null', '1': 'Silver', '2': 'Yellow', '3': 'Green', '4': 'Black', '5': 'Orange', '6': 'White', '7': 'Red', '8': 'Blue', '9': 'Purple' };
const TAGS = {
    status: { Mark: "Null", Impair: "Silver", Slow: "Yellow", Daze: "Green", Curse: "Black", Bind: "Orange", Weaken: "White", Blight: "Red", Silence: "Blue", Nullify: "Purple" },
    boost: { Liberate: "Null", Augment: "Silver", Haste: "Yellow", Ward: "Green", Bless: "Black", Charge: "Orange", Cure: "White", Regen: "Red", Enhance: "Blue", Obscure: "Purple" }
};

// --- HIERARCHICAL PARSING LOGIC ---
function parseBlueprintString(fullString) {
    if (!fullString.startsWith("C:")) return null;
    const ecosystem = { character: null };
    const parts = fullString.split(/([@\/])/);
    const rootString = parts.shift();
    const charData = parseEntityString(rootString);
    if (!charData) return null;
    ecosystem.character = calculateCharacterStats(charData);
    let parentStack = [ecosystem.character];
    for (let i = 0; i < parts.length; i += 2) {
        const delimiter = parts[i];
        const entityString = parts[i + 1];
        if (delimiter === '@') { parentStack = [ecosystem.character]; }
        let currentParent = parentStack[parentStack.length - 1];
        const entityData = parseEntityString(entityString);
        if (!entityData) continue;
        if (!currentParent.attachments) { currentParent.attachments = []; }
        if (entityData.type === 'Animation') {
            const anim = calculateAnimationStats(entityData);
            anim.attachments = [];
            currentParent.attachments.push(anim);
            parentStack.push(anim);
        } else {
            currentParent.attachments.push(entityData);
        }
    }
    return ecosystem;
}
function parseEntityString(entityString) {
    const typeMap = { C: 'Character', A: 'Animation', I: 'Item', F: 'Faction' };
    const typePrefix = entityString[0];
    if (!typeMap[typePrefix]) return null;
    const data = { raw: entityString, type: typeMap[typePrefix], profile: null, flawPackage: null, keywords: [], level: 0, systems: [] };
    let content = entityString.substring(2);
    const profileMatch = content.match(/^\d{5}/);
    if (profileMatch) { data.profile = profileMatch[0]; content = content.substring(5); }
    const levelMatch = content.match(/^L(\d)/);
    if (levelMatch) { data.level = parseInt(levelMatch[1], 10); content = content.substring(2); }
    const flawMatch = content.match(/\+(\d{4})/);
    if (flawMatch) {
        data.flawPackage = { flaw: {name: KEYWORD_DATA[flawMatch[1].substring(0,2)].n, color: KEYWORD_DATA[flawMatch[1].substring(0,2)].c }, compensation: {name: KEYWORD_DATA[flawMatch[1].substring(2,4)].n, color: KEYWORD_DATA[flawMatch[1].substring(2,4)].c } };
        content = content.replace(flawMatch[0], '');
    }
    const systemsMatch = content.match(/\[S([\d\.]+)\]/);
    if(systemsMatch) { data.systems = systemsMatch[1].split('.'); content = content.replace(systemsMatch[0], ''); }
    let keywordString = content;
    if (data.type === 'Character') {
         keywordString = content.startsWith('-') ? content.substring(1) : content;
    }
    if (keywordString) {
        const blocks = keywordString.split('-');
        blocks.forEach(block => {
            const parts = block.split('.');
            if (parts.length === 0 || (parts.length === 1 && !parts[0])) return;
            const lastPart = parts[parts.length - 1];
            let statChoice = null; let keywordParts = parts;
            if (STAT_MAP[lastPart]) { statChoice = lastPart; keywordParts = parts.slice(0, -1); }
            let tempKeywordsForGroup = [];
            keywordParts.forEach(partStr => {
                if (!partStr) return;
                const isPassive = partStr.startsWith('!'); let codePart = partStr.replace('!', '');
                const optionMatch = codePart.match(/\((\d+)\)/);
                const option = optionMatch ? optionMatch[1] : null;
                if (optionMatch) codePart = codePart.replace(optionMatch[0], '');
                if (KEYWORD_DATA[codePart]) {
                    tempKeywordsForGroup.push({ name: KEYWORD_DATA[codePart].n, color: KEYWORD_DATA[codePart].c, code: codePart, isPassive, option, statChoice: null });
                }
            });
            if (statChoice && tempKeywordsForGroup.length > 0) { tempKeywordsForGroup[tempKeywordsForGroup.length - 1].statChoice = statChoice; }
            data.keywords.push(...tempKeywordsForGroup);
        });
    }
    return data;
}

// --- CALCULATION LOGIC ---
function calculateCharacterStats(charData) {
    const totalKeywords = charData.keywords.length;
    let level = 0;
    if (totalKeywords >= 20) level = 9; else if (totalKeywords >= 18) level = 8; else if (totalKeywords >= 16) level = 7; else if (totalKeywords >= 14) level = 6; else if (totalKeywords >= 12) level = 5; else if (totalKeywords >= 10) level = 4; else if (totalKeywords >= 8) level = 3; else if (totalKeywords >= 6) level = 2; else if (totalKeywords >= 4) level = 1; else if (totalKeywords >= 1) level = 0;
    charData.level = level;
    const stats = {}; const baseStat = (level >= 1) ? 2 : 1;
    STAT_ORDER.forEach(s => stats[s] = baseStat);
    charData.keywords.forEach(kw => { if(kw.statChoice && STAT_MAP[kw.statChoice]) { stats[kw.statChoice]++; } });
    charData.stats = stats;
    const statValues = Object.values(stats).sort((a, b) => b - a);
    charData.resistance = statValues.slice(0, 3).reduce((a, b) => a + b, 0);
    charData.innatePassiveSlots = stats.F; charData.gearPassiveSlots = stats.E;
    charData.hp = { current: 10, max: 10 }; charData.sp = { current: 10, max: 10 }; charData.ep = { current: 10, max: 10 };
    return charData;
}
function calculateAnimationStats(animData) {
    animData.level = animData.keywords.length - 1;
    const stats = {};
    STAT_ORDER.forEach(s => stats[s] = 1);
    animData.keywords.forEach(kw => { if (kw.statChoice && STAT_MAP[kw.statChoice]) { stats[kw.statChoice]++; } });
    animData.stats = stats;
    const statValues = Object.values(stats).sort((a, b) => b - a);
    animData.resistance = statValues.slice(0, 3).reduce((a, b) => a + b, 0);
    animData.hp = { current: 10, max: 10 }; animData.sp = { current: 10, max: 10 }; animData.ep = { current: 10, max: 10 };
    return animData;
}

// --- REUSABLE COMPONENT FACTORIES ---
function createClockComponent(type, initialCurrent, initialMax) {
    let current = initialCurrent; let max = initialMax;
    const typeColors = { hp: 'Green', sp: 'Orange', ep: 'Purple' };
    const color = typeColors[type];
    const component = document.createElement('div');
    component.className = 'clock-component';
    const label = document.createElement('span');
    label.className = `clock-label color-${color}`;
    label.textContent = type.toUpperCase();
    const pipContainer = document.createElement('div');
    pipContainer.className = `pip-container ${type}-pips`;
    const maxInput = document.createElement('input');
    maxInput.type = 'number'; maxInput.className = `clock-max-input border-${color}`;
    maxInput.value = max; maxInput.min = 1;
    function redrawPips() {
        pipContainer.innerHTML = '';
        for (let i = 1; i <= max; i++) {
            const pip = document.createElement('div');
            pip.className = 'pip';
            if (i <= current) { pip.classList.add('filled'); }
            pip.dataset.index = i;
            pipContainer.appendChild(pip);
        }
    }
    pipContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('pip')) {
            const clickedIndex = parseInt(e.target.dataset.index, 10);
            if (clickedIndex === 1) { current = (current === 1) ? 0 : 1; } 
            else { current = clickedIndex; }
            redrawPips();
        }
    });
    maxInput.addEventListener('change', (e) => {
        max = Math.max(1, parseInt(e.target.value, 10) || 10);
        if (current > max) current = max;
        redrawPips();
    });
    component.append(label, pipContainer, document.createTextNode('/'), maxInput);
    redrawPips();
    return component;
}
function createProfileCard(profileCode) {
    if (!profileCode || profileCode.length !== 5) return document.createDocumentFragment();
    const card = document.createElement('div');
    card.className = 'profile-card';
    const roles = ['Goal', 'Method', 'Purpose', 'External Conflict', 'Internal Conflict'];
    roles.forEach((role, i) => {
        const digit = profileCode[i];
        const motivationName = MOTIVATION_MAP[digit];
        const motivationColor = MOTIVATION_COLORS[digit];
        const entry = document.createElement('div');
        entry.className = 'profile-entry';
        entry.innerHTML = `<span class="profile-role">${role}:</span><span class="profile-motivation color-${motivationColor}">${motivationName}</span>`;
        card.appendChild(entry);
    });
    return card;
}

// --- MAIN RENDERING LOGIC ---
function renderCharacterSheet(ecosystem) {
    const { character } = ecosystem;
    ['stat-grid', 'keyword-list', 'char-hp-clock', 'char-sp-clock', 'char-ep-clock', 'character-profile-card'].forEach(id => document.getElementById(id).innerHTML = '');
    document.getElementById('items-display').innerHTML = '<h3>Items</h3><ul id="item-list" class="item-list"></ul>';
    document.getElementById('animations-display').innerHTML = '<h3>Animations</h3>';
    document.getElementById('factions-display').innerHTML = '<h3>Factions</h3>';
    document.getElementById('character-name-input').value = 'Character';
    document.getElementById('char-level').textContent = character.level;
    document.getElementById('char-resistance').textContent = character.resistance;
    document.getElementById('character-profile-card').appendChild(createProfileCard(character.profile));
    document.getElementById('char-hp-clock').appendChild(createClockComponent('hp', character.hp.current, character.hp.max));
    document.getElementById('char-sp-clock').appendChild(createClockComponent('sp', character.sp.current, character.sp.max));
    document.getElementById('char-ep-clock').appendChild(createClockComponent('ep', character.ep.current, character.ep.max));
    populateTagControls('char');
    const statGrid = document.getElementById('stat-grid');
    STAT_ORDER.forEach(statKey => {
        const statBox = document.createElement('div');
        statBox.className = 'stat-box';
        statBox.innerHTML = `<div class="stat-name">${STAT_MAP[statKey]} (${statKey})</div><div class="stat-value">${character.stats[statKey]}</div>`;
        statGrid.appendChild(statBox);
    });
    const keywordList = document.getElementById('keyword-list');
    character.keywords.forEach(kw => {
        const li = document.createElement('li'); li.className = 'keyword-item';
        li.innerHTML = `<span class="keyword-passive-icon">${kw.isPassive ? '*' : '&nbsp;'}</span><span class="keyword-name color-${kw.color}">${kw.name}${kw.option ? `(${kw.option})` : ''}</span>`;
        keywordList.appendChild(li);
    });
    if(character.flawPackage) {
        const li = document.createElement('li'); li.className = 'keyword-item';
        li.innerHTML = `<span class="keyword-passive-icon">&nbsp;</span><span class="keyword-name color-${character.flawPackage.flaw.color}">${character.flawPackage.flaw.name} (Flaw)</span>`;
        const li2 = document.createElement('li'); li2.className = 'keyword-item';
        li2.innerHTML = `<span class="keyword-passive-icon">&nbsp;</span><span class="keyword-name color-${character.flawPackage.compensation.color}">${character.flawPackage.compensation.name} (Comp)</span>`;
        keywordList.append(li, li2);
    }
    const itemsList = document.getElementById('item-list');
    const animsDisplay = document.getElementById('animations-display');
    const factionsDisplay = document.getElementById('factions-display');
    let animCounter = 0;
    character.attachments.forEach(attachment => {
        if (attachment.type === 'Item') itemsList.appendChild(createItemLi(attachment));
        else if (attachment.type === 'Animation') animsDisplay.appendChild(createAnimationCard(attachment, animCounter++));
        else if (attachment.type === 'Faction') factionsDisplay.appendChild(createFactionDiv(attachment));
    });
    if (itemsList.children.length === 0) itemsList.innerHTML = '<li class="item-keywords">No items equipped.</li>';
    if (animsDisplay.children.length <= 1) animsDisplay.innerHTML += '<p class="item-keywords">No animations in ecosystem.</p>';
    if (factionsDisplay.children.length <= 1) factionsDisplay.innerHTML += '<p class="item-keywords">No factions in ecosystem.</p>';
    document.getElementById('character-sheet').style.display = 'flex';
}

function createItemLi(item) {
    const li = document.createElement('li'); li.className = 'item';
    const kwNames = item.keywords.map(k => k.name).join(', ');
    li.innerHTML = `<input type="text" class="entity-name-input" value="Lvl ${item.level} Item"><span class="item-keywords">: ${kwNames || 'No keywords'}</span>`;
    return li;
}
function createFactionDiv(faction) {
    const div = document.createElement('div');
    div.className = 'faction-display';
    div.innerHTML = `<span class="faction-name">Lvl ${faction.level} Faction</span>`;
    if (faction.profile) { div.appendChild(createProfileCard(faction.profile)); }
    return div;
}
function createAnimationCard(anim, index) {
    const card = document.createElement('div');
    card.className = 'animation-card';
    card.id = `anim-${index}`;
    const animName = anim.keywords[0] ? anim.keywords[0].name : 'Animation';
    card.innerHTML = `
        <div class="animation-header">
            <input type="text" class="entity-name-input" value="${animName}">
            <span>Lvl ${anim.level} | Res ${anim.resistance}</span>
        </div>
        <div class="stat-grid" id="anim-${index}-stat-grid"></div>
        <div class="resource-clocks-container" id="anim-${index}-clocks" style="margin-top: 8px;"></div>
        <div class="keywords-container" style="margin-top: 10px;">
            <h4>Keywords</h4>
            <ul class="keyword-list" id="anim-${index}-keyword-list"></ul>
        </div>
        <div class="tag-manager" style="margin-top: 10px;">
             <h3>Status Tags</h3><div class="tag-list" id="anim-${index}-status-tag-list"></div>
             <h3>Boost Tags</h3><div class="tag-list" id="anim-${index}-boost-tag-list"></div>
        </div>
        <div class="item-attachments">
            <h4>Equipped</h4><ul class="item-list" id="anim-${index}-item-list"></ul>
        </div>`;
    const equippedList = card.querySelector(`#anim-${index}-item-list`);
    if (anim.attachments && anim.attachments.length > 0) {
        anim.attachments.forEach(attachment => {
            if (attachment.type === 'Item') equippedList.appendChild(createItemLi(attachment));
        });
    } else { equippedList.innerHTML = '<li class="item-keywords">None</li>'; }
    setTimeout(() => {
        const clockContainer = card.querySelector(`#anim-${index}-clocks`);
        clockContainer.appendChild(createClockComponent('hp', anim.hp.current, anim.hp.max));
        clockContainer.appendChild(createClockComponent('sp', anim.sp.current, anim.sp.max));
        clockContainer.appendChild(createClockComponent('ep', anim.ep.current, anim.ep.max));
        const statGrid = card.querySelector(`#anim-${index}-stat-grid`);
        STAT_ORDER.forEach(statKey => {
            const statBox = document.createElement('div');
            statBox.className = 'stat-box';
            statBox.innerHTML = `<div class="stat-name">${STAT_MAP[statKey]} (${statKey})</div><div class="stat-value">${anim.stats[statKey]}</div>`;
            statGrid.appendChild(statBox);
        });
        const keywordList = card.querySelector(`#anim-${index}-keyword-list`);
        anim.keywords.forEach(kw => {
            const li = document.createElement('li'); li.className = 'keyword-item';
            li.innerHTML = `<span class="keyword-passive-icon">${kw.isPassive ? '*' : '&nbsp;'}</span><span class="keyword-name color-${kw.color}">${kw.name}${kw.option ? `(${kw.option})` : ''}</span>`;
            keywordList.appendChild(li);
        });
        populateTagControls(`anim-${index}`);
    }, 0);
    return card;
}
function populateTagControls(prefix) {
    const statusList = document.getElementById(`${prefix}-status-tag-list`);
    const boostList = document.getElementById(`${prefix}-boost-tag-list`);
    if(!statusList || !boostList) return;
    statusList.innerHTML = ''; boostList.innerHTML = '';
    Object.entries(TAGS.status).forEach(([name, color]) => {
        const tagEntry = document.createElement('div'); tagEntry.className = 'tag-entry';
        tagEntry.innerHTML = `<span class="color-${color}">${name}</span><input type="number" class="tag-quantity border-${color}" value="0" min="0">`;
        statusList.appendChild(tagEntry);
    });
    Object.entries(TAGS.boost).forEach(([name, color]) => {
        const tagEntry = document.createElement('div'); tagEntry.className = 'tag-entry';
        tagEntry.innerHTML = `<span class="color-${color}">${name}</span><input type="number" class="tag-quantity border-${color}" value="0" min="0">`;
        boostList.appendChild(tagEntry);
    });
}

// --- EVENT LISTENERS ---
document.getElementById('load-button').addEventListener('click', () => {
    const inputString = document.getElementById('blueprint-input').value.trim();
    if (inputString) {
        try {
            const ecosystem = parseBlueprintString(inputString);
            if (ecosystem && ecosystem.character) { renderCharacterSheet(ecosystem); } 
            else { alert("Invalid or incomplete Blueprint String. Must start with 'C:'."); }
        } catch (e) {
            console.error("Error parsing blueprint:", e);
            alert("An error occurred while parsing the blueprint. Check the console for details.");
        }
    }
});
document.getElementById('karma-plus').addEventListener('click', () => {
    const karmaEl = document.getElementById('karma-value');
    karmaEl.textContent = parseInt(karmaEl.textContent, 10) + 1;
});
document.getElementById('karma-minus').addEventListener('click', () => {
    const karmaEl = document.getElementById('karma-value');
    let currentKarma = parseInt(karmaEl.textContent, 10);
    if (currentKarma > 0) karmaEl.textContent = currentKarma - 1;
});
</script>
