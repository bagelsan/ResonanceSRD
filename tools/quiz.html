<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Assessment</title>
    <style>
        /* --- Basic Styling to Match Your Site --- */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Lora&display=swap');

        body {
            background-color: #212121;
            color: #ccc;
            font-family: "Calibri", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 2em;
        }

        h1, h2, h3 {
            font-family: "Oswald", sans-serif;
            color: #D2B48C; /* A tan/brown color to match the theme */
        }

        #quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #333;
            padding: 2em;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .question-block {
            margin-bottom: 2.5em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid #444;
        }

        .question-block p {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 1em;
        }

        .question-block label {
            display: block;
            margin-bottom: 0.8em;
            padding: 0.8em;
            background-color: #424242;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        .question-block label:hover {
            background-color: #555;
        }
        
        .question-block input[type="radio"] {
            margin-right: 10px;
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 1em;
            font-family: "Oswald", sans-serif;
            font-size: 1.5em;
            color: #212121;
            background-color: #FFC107; /* Amber accent color */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 2em;
            transition: background-color 0.2s ease-in-out;
        }

        #submit-btn:hover {
            background-color: #FFD54F;
        }

        #results-container {
            display: none; /* Hidden by default */
            margin-top: 2em;
            padding: 2em;
            border: 2px solid #FFC107;
            border-radius: 8px;
            background-color: #2a2a2a;
            font-family: "Lora", serif;
        }

        #results-container h2 {
            text-align: center;
        }
        
        .result-vector {
            font-family: "Oswald", sans-serif;
            font-size: 1.5em;
            text-align: center;
            color: #fff;
            margin-bottom: 1em;
        }

        .result-aura {
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 1.5em;
        }
        
        .result-description {
            font-size: 1.1em;
        }

    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>Resonance Assessment</h1>
        <p>This assessment is designed to identify your core resonance. Choose the answer that feels most true to your natural way of thinking or acting. Your first instinct is often the most accurate.</p>
        <form id="resonance-quiz">
            <!-- Questions will be dynamically inserted here by JavaScript -->
        </form>
        <button type="button" id="submit-btn">Calculate My Resonance</button>
        <div id="results-container">
            <!-- Results will be dynamically inserted here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const quizData = [
                // Section A: Motivation
                { q: "Your community's only water source is poisoned. What is your immediate, primary focus?", s: { a: "Body", b: "Mind", c: "Essence" }, a: { a: "The physical well-being of the people. I organize teams to find clean water and ration supplies to prevent sickness.", b: "The systemic failure. I launch an investigation to find the poison's source and create a new system to ensure this never happens again.", c: "The moral violation. This was a malicious act. My focus is on finding the person responsible and ensuring justice is served."}},
                { q: "You look back on a period of intense personal growth. What is the clearest sign of your progress?", s: { a: "Mind", b: "Essence", c: "Body" }, a: { a: "I have acquired new knowledge and can now understand complex systems I couldn't before.", b: "I am more in tune with who I truly am, and my actions are more aligned with my core values.", c: "I am physically healthier, my senses are sharper, and my gut instincts are more reliable."}},
                { q: "What truly makes a house a 'home'?", s: { a: "Essence", b: "Body", c: "Mind" }, a: { a: "It is a place of authentic self-expression, where I feel a true sense of belonging and purpose.", b: "It is a place of physical comfort, security, and sensory peace.", c: "It is an orderly and efficient space where the social dynamics are clear, fair, and logical."}},
                { q: "You discover a trusted leader has been lying to the community. Which aspect of the betrayal cuts the deepest?", s: { a: "Essence", b: "Body", c: "Mind" }, a: { a: "The violation of a core principle. Honesty is fundamental, and they broke that sacred trust.", b: "The emotional manipulation and the hurt it has caused the people who believed in them.", c: "The logical breakdown. The system of trust was based on false data, meaning all subsequent decisions are flawed."}},
                { q: "If you had to choose a metaphorical 'weapon' to solve your problems, what would it be?", s: { a: "Body", b: "Mind", c: "Essence" }, a: { a: "A perfectly balanced hammer. A direct, physical tool for both building and breaking.", b: "A grand library. Access to all the world's information and the logic to use it.", c: "An inspiring symbol. An icon that represents my will and rallies others to my cause."}},
                { q: "What frustrates you the most in others?", s: { a: "Mind", b: "Essence", c: "Body" }, a: { a: "Willful ignorance and illogical thinking.", b: "Hypocrisy and inauthenticity.", c: "Physical carelessness and a lack of situational awareness."}},
                { q: "Which experience brings you the most profound sense of joy?", s: { a: "Essence", b: "Body", c: "Mind" }, a: { a: "A moment of deep, purposeful connection with another person or a cause.", b: "A thrilling physical experience that makes you feel alive and fully present in your body.", c: "The 'eureka' moment when a complex problem suddenly becomes clear and you see the perfect solution."}},
                { q: "When making a life-altering decision, what is your ultimate tie-breaker?", s: { a: "Body", b: "Mind", c: "Essence" }, a: { a: "My gut instinct and the physical sensations in my body.", b: "The hard data and a logical analysis of the potential outcomes.", c: "My unwavering moral compass and core principles."}},
                { q: "The story of your life should be, above all, a story of...", s: { a: "Mind", b: "Essence", c: "Body" }, a: { a: "Intellectual contribution and the systems you helped build or improve.", b: "Unwavering character and the positive impact your will had on the world.", c: "Rich, visceral experiences and incredible physical feats."}},
                // Section B: Context
                { q: "An ancient, powerful technology is discovered. What is your first order of business?", s: { a: "Foundation", b: "Control", c: "Execution" }, a: { a: "Understand its core principles. We cannot use it until we understand the fundamental theory of why it works.", b: "Establish strict protocols. We must secure it, manage access, and monitor it to ensure it is handled safely.", c: "Test its functionality. The best way to learn is by doing. I would begin careful, hands-on experiments immediately."}},
                { q: "You are tasked with building a highly effective team. What is the most critical component?", s: { a: "Control", b: "Execution", c: "Foundation" }, a: { a: "A clear and disciplined operational structure with well-defined roles and rules of engagement.", b: "Recruiting the most skilled individuals and empowering them to execute their tasks with minimal interference.", c: "A shared, foundational vision and a powerful mission statement that everyone believes in."}},
                { q: "Your community is facing a long, harsh winter. What is the most important preparation?", s: { a: "Execution", b: "Foundation", c: "Control" }, a: { a: "Taking immediate action: gathering firewood, insulating homes, and hunting for food stores.", b: "Reinforcing our core values and the 'why' of our community, to ensure our social fabric survives the hardship.", c: "Implementing a meticulous resource management plan: rationing food, scheduling work shifts, and monitoring supplies."}},
                { q: "How do you prefer to learn a new, complex skill?", s: { a: "Foundation", b: "Control", c: "Execution" }, a: { a: "By studying the fundamental theories and history behind it first.", b: "Through a disciplined regimen of practice, drills, and structured repetition.", c: "By jumping straight into a real-world project and learning by doing."}},
                { q: "You must pass on your most valuable knowledge. What form does it take?", s: { a: "Control", b: "Execution", c: "Foundation" }, a: { a: "A structured curriculum with clear lessons, exercises, and assessments to manage a student's progress.", b: "A hands-on apprenticeship where the student learns by actively working alongside me.", c: "A philosophical text that explains the core principles and the 'why' behind the knowledge, allowing students to find their own way."}},
                { q: "A community has fallen into disarray due to internal conflict. Where do you begin to fix it?", s: { a: "Execution", b: "Foundation", c: "Control" }, a: { a: "Launch a high-visibility, practical project that gets everyone working together on a tangible goal to build momentum.", b: "Bring everyone together to re-establish their founding charter and remind them of the core principles they all agreed to.", c: "Mediate the conflicts, establish new rules of conduct, and manage the emotional state of the community."}},
                { q: "Which of these represents true strength?", s: { a: "Foundation", b: "Control", c: "Execution" }, a: { a: "Unshakeable principles that you would never compromise.", b: "Disciplined self-mastery and control over one's impulses.", c: "The proven ability to execute a plan and achieve results."}},
                { q: "Someone insults your core beliefs in a public setting. How do you respond?", s: { a: "Control", b: "Execution", c: "Foundation" }, a: { a: "I de-escalate the situation, manage the emotional temperature of the room, and prevent further conflict.", b: "With a direct and immediate action—a witty comeback, a sharp counter-argument, or a challenge.", c: "I ignore the personal insult and instead defend the underlying principle that was attacked, explaining why it is important."}},
                { q: "You are preparing for a long and dangerous journey. What is the most critical preparation?", s: { a: "Execution", b: "Foundation", c: "Control" }, a: { a: "Getting a reliable map and taking the first step. The journey is the plan.", b: "Understanding the culture, history, and fundamental nature of the lands I will be passing through.", c: "Meticulous logistical planning: packing the right gear, managing supplies, and setting a sustainable pace."}},
                // Section C: Perspective
                { q: "Having mastered a rare and valuable skill, what brings you the most satisfaction?", s: { a: "Internal", b: "External", c: "Collaborative" }, a: { a: "The quiet fulfillment of perfecting my own craft and deepening my personal understanding.", b: "Disseminating the knowledge to the world by teaching it to as many individuals as possible.", c: "Forming a new guild or institution with other experts to create something greater than the sum of our parts."}},
                { q: "You receive an unexpected windfall of resources. What is your first instinct?", s: { a: "External", b: "Collaborative", c: "Internal" }, a: { a: "Donate it to an important cause or a specific person who I know is in desperate need.", b: "Use it to fund a project that will benefit my entire community or team.", c: "Invest it in my own well-being, tools, and personal growth."}},
                { q: "'Success' is ultimately measured by...", s: { a: "Collaborative", b: "Internal", c: "External" }, a: { a: "The strength and prosperity of the group, team, or family I am a part of.", b: "The achievement of personal enlightenment and true self-mastery.", c: "The tangible, positive impact I have made on the wider world or on another individual's life."}},
                { q: "You witness a gross injustice. How do you prefer to fight it?", s: { a: "External", b: "Collaborative", c: "Internal" }, a: { a: "By directly confronting the perpetrator or providing immediate aid to the individual who was wronged.", b: "By organizing a protest group or social movement to challenge the system that allowed the injustice to occur.", c: "By refusing to participate in the unjust system myself and focusing on purifying my own actions to live as a better example."}},
                { q: "When you need guidance on a difficult problem, where do you turn?", s: { a: "Internal", b: "External", c: "Collaborative" }, a: { a: "Inward, to my own intuition and quiet contemplation.", b: "Outward, to a one-on-one conversation with a single, trusted mentor or expert.", c: "To my inner circle, for a group brainstorming session where we can all share our perspectives."}},
                { q: "If you were to tell a grand story, what would it be about?", s: { a: "External", b: "Collaborative", c: "Internal" }, a: { a: "The biography of a singular, great individual who changed the world through their actions.", b: "The epic tale of a fellowship of heroes who achieved the impossible together.", c: "An introspective journey of one person's quest for self-discovery and inner peace."}},
                { q: "Your ultimate loyalty lies with...", s: { a: "Internal", b: "External", c: "Collaborative" }, a: { a: "My own conscience and my unwavering personal principles.", b: "A specific individual—a partner, a child, a leader—whom I have sworn to protect.", c: "My community, my 'crew,' my people—the collective group as a whole."}},
                { q: "When a team project you are on fails, what is your first internal question?", s: { a: "External", b: "Collaborative", c: "Internal" }, a: { a: "What external force or individual sabotaged our efforts?", b: "How did we fail in our communication and teamwork?", c: "What was my personal mistake in this process?"}},
                { q: "What environment best recharges your energy?", s: { a: "External", b: "Collaborative", c: "Internal" }, a: { a: "A deep and meaningful one-on-one conversation.", b: "A lively party or a collaborative team event.", c: "Quiet solitude for introspection and reflection."}}
            ];

            const quizForm = document.getElementById('resonance-quiz');
            const submitBtn = document.getElementById('submit-btn');
            const resultsContainer = document.getElementById('results-container');

            // --- Dynamically build the quiz HTML ---
            let quizHTML = '';
            quizData.forEach((item, index) => {
                quizHTML += `
                    <div class="question-block">
                        <p>${index + 1}. ${item.q}</p>
                        <label><input type="radio" name="q${index}" value="a" required> ${item.a.a}</label>
                        <label><input type="radio" name="q${index}" value="b"> ${item.a.b}</label>
                        <label><input type="radio" name="q${index}" value="c"> ${item.a.c}</label>
                    </div>
                `;
            });
            quizForm.innerHTML = quizHTML;

            // --- Handle the button click ---
            submitBtn.addEventListener('click', function() {
                const scores = {
                    Body: 0, Mind: 0, Essence: 0,
                    Foundation: 0, Control: 0, Execution: 0,
                    Internal: 0, External: 0, Collaborative: 0
                };

                const selectedAnswers = quizForm.querySelectorAll('input[type="radio"]:checked');
                
                if (selectedAnswers.length < quizData.length) {
                    alert('Please answer all questions before calculating your resonance.');
                    return;
                }

                selectedAnswers.forEach(input => {
                    const qIndex = parseInt(input.name.substring(1));
                    const answer = input.value;
                    const scoreCategory = quizData[qIndex].s[answer];
                    scores[scoreCategory]++;
                });

                displayResults(scores);
            });

            function displayResults(scores) {
                const motivationScores = { Body: scores.Body, Mind: scores.Mind, Essence: scores.Essence };
                const contextScores = { Foundation: scores.Foundation, Control: scores.Control, Execution: scores.Execution };
                const perspectiveScores = { Internal: scores.Internal, External: scores.External, Collaborative: scores.Collaborative };

                const dominantMotivation = Object.keys(motivationScores).reduce((a, b) => motivationScores[a] > motivationScores[b] ? a : b);
                const dominantContext = Object.keys(contextScores).reduce((a, b) => contextScores[a] > contextScores[b] ? a : b);
                const dominantPerspective = Object.keys(perspectiveScores).reduce((a, b) => perspectiveScores[a] > perspectiveScores[b] ? a : b);

                const auraMap = {
                    Body: { Control: "Silver (Absolution)", Execution: "Yellow (Presence)", Foundation: "Green (Sovereignty)" },
                    Mind: { Control: "Black (Integrity)", Execution: "Orange (Growth)", Foundation: "White (Justice)" },
                    Essence: { Control: "Red (Accountability)", Execution: "Blue (Autonomy)", Foundation: "Purple (Self-Knowledge)" }
                };
                
                const [auraColor, tenetName] = auraMap[dominantMotivation][dominantContext].split(' (');
                const tenet = tenetName.slice(0, -1);

                let resultsHTML = `
                    <h2>Your Resonance Profile</h2>
                    <p class="result-vector"><strong>Resonance Vector:</strong> ${dominantMotivation} / ${dominantContext} / ${dominantPerspective}</p>
                    <p class="result-aura"><strong>Primary Aura:</strong> ${auraColor}, governed by the <strong>Tenet of ${tenet}</strong></p>
                    <hr>
                    <p class="result-description">This means you are a <strong>${dominantPerspective} ${tenet}</strong>. Your core drive originates from your <strong>${dominantMotivation}</strong>. You are most effective and comfortable when applying this drive through a lens of <strong>${dominantContext}</strong>. Your actions are most naturally directed in a <strong>${dominantPerspective}</strong> scope, which defines how you interact with yourself, others, and the world.</p>
                `;

                resultsContainer.innerHTML = resultsHTML;
                resultsContainer.style.display = 'block';
                submitBtn.style.display = 'none'; // Hide the button after calculation
                window.scrollTo(0, document.body.scrollHeight); // Scroll to the results
            }
        });
    </script>

</body>
</html>
