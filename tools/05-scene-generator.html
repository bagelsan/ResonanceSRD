<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychromattica Scene Generator</title>
    <!-- LINK TO SHARED ENGINE & DATA -->
    <script src="PsychromatticaEngine.js"></script>
    <style>
        :root {
            --color-null: #dea193; --color-silver: #a7a9ac; --color-yellow: #f5d36c;
            --color-green: #688d4c; --color-black: #414042; --color-orange: #f7855d;
            --color-white: #e3e1da; --color-red: #a95b5a; --color-blue: #88bfe8;
            --color-purple: #957fa3; --color-background: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--color-background); color: var(--color-white); font-family: Calibri, sans-serif; font-size: 12pt; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        h2, h3 { font-weight: normal; font-family: 'Oswald', sans-serif; color: var(--color-null); margin-bottom: 10px;}
        h3 { color: var(--color-silver); margin-top: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .section { border: 1px solid var(--color-black); background-color: #2a2a2a; padding: 20px; border-radius: 3px; }
        button {
            background-color: var(--color-blue); color: var(--color-black); font-weight: bold;
            border: 1px solid var(--color-silver); padding: 12px 15px; font-family: Calibri, sans-serif;
            font-size: 1.2em; cursor: pointer; border-radius: 2px; transition: background-color 0.2s;
            width: 100%; margin-top: 15px;
        }
        button:hover { background-color: var(--color-silver); }
        .button-small { padding: 4px 12px; font-size: 10pt; margin-top: 0; width: auto; background-color: var(--color-black); color: var(--color-white);}
        button:hover { background-color: var(--color-silver); color: var(--color-black);}
        input[type="number"] { background-color: #333; border: 1px solid var(--color-silver); color: var(--color-white); padding: 8px; font-family: Calibri, sans-serif; width: 100%; border-radius: 2px; margin-top: 5px; font-size: 1.1em;}
        label { font-size: 10pt; color: var(--color-silver); display: block; font-weight: bold; text-transform: uppercase;}
        #output-string { font-family: 'Courier New', Courier, monospace; font-size: 10pt; background-color: #1a1a1a; color: var(--color-yellow); min-height: 100px; resize: vertical; width: 100%; padding: 10px; border: 1px solid #444; border-radius: 2px; line-height: 1.4;}
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        #manifest-details {
            font-family: 'Courier New', Courier, monospace; font-size: 10pt; text-align: left;
            background-color: #1a1a1a; padding: 15px; border-radius: 3px; white-space: pre-wrap;
            min-height: 150px; margin-top: 15px; border: 1px solid #444; line-height: 1.5; color: #ccc;
        }
        .highlight-title { color: var(--color-white); font-weight: bold; font-size: 1.1em;}
        .highlight-kw { color: var(--color-null); }
        .highlight-type { color: var(--color-yellow); }
        .highlight-race { color: var(--color-red); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h2>Procedural Scene Generator</h2>
            <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
                <div>
                    <label for="player-level-input">Average Party Level</label>
                    <input type="number" id="player-level-input" value="1" min="0" max="9">
                    <p style="font-size: 9pt; color: var(--color-silver); margin-top: 5px;">This dictates the Level Modifier (L-1 to L+2) for entities and challenges.</p>
                </div>
            </div>
            <button id="generate-button">Execute Procedural Generation</button>
        </div>
        
        <div class="section output-section">
            <h2>Generated Scene Blueprint</h2>
            <textarea id="output-string" readonly spellcheck="false">Awaiting execution...</textarea>
            
            <div class="controls-row">
                <p style="font-size: 9pt; color: var(--color-silver); margin: 0;">This string contains fully compliant AST entities ready for Dashboard parsing.</p>
                <div style="display: flex; gap: 10px;">
                    <button id="copy-button" class="button-small">Copy Blueprint</button>
                    <button id="send-dash-button" class="button-small" style="background-color: var(--color-purple); color: var(--color-white);">Load to Dashboard</button>
                </div>
            </div>

            <h3 style="margin-top: 25px;">Manifest Readout</h3>
            <pre id="manifest-details">Readout will appear here...</pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- RNG Helpers ---
            const roll = (sides) => Math.floor(Math.random() * sides) + 1;
            const rollD100Str = () => String(roll(100) - 1).padStart(2, '0');

            // --- Flaw Protocol ---
            function rollValidKeyword(flawState, excludeList =[]) {
                while (true) {
                    let kw = rollD100Str();
                    if (excludeList.includes(kw)) continue;
                    if (parseInt(kw) % 10 === 0) {
                        if (!flawState.hasFlaw) {
                            let comp;
                            do { comp = rollD100Str(); } while (parseInt(comp) % 10 === 0);
                            flawState.hasFlaw = true;
                            flawState.flawString = `+${kw}${comp}`;
                        }
                        continue;
                    }
                    return kw;
                }
            }

            // --- Level Modifier Calculation ---
            function getLevelMod(partyLevel) {
                const r = roll(10);
                let mod = 0;
                if (r <= 4) mod = -1;
                else if (r <= 8) mod = 0;
                else if (r === 9) mod = 1;
                else if (r === 10) mod = 2;
                return Math.max(0, partyLevel + mod);
            }

            // --- Entity Generators ---
            function generateCharacter(level) {
                let flawState = { hasFlaw: false, flawString: "" };
                let kws = [];
                let stringBlocks =[];
                const profile = Array(5).fill(0).map(() => roll(10) - 1).join('');
                let buildString = `C:${profile}`;
                let seed = rollValidKeyword(flawState, kws);
                kws.push(seed);
                let seedBlock = `${seed}`;
                if (level >= 1) {
                    let awkKws =[];
                    for(let i=0; i<3; i++) {
                        let k = rollValidKeyword(flawState, kws);
                        awkKws.push(k); kws.push(k);
                    }
                    let awkStats = Array(3).fill(0).map(() => PsychroEngine.Data.STAT_KEYS[roll(9)-1]);
                    stringBlocks.push(`${awkKws.join('.')}.${awkStats.join('')}`);
                }
                for (let i = 2; i <= level; i++) {
                    let progKws =[];
                    for(let j=0; j<2; j++) {
                        let k = rollValidKeyword(flawState, kws);
                        progKws.push(k); kws.push(k);
                    }
                    let stat = PsychroEngine.Data.STAT_KEYS[roll(9)-1];
                    stringBlocks.push(`${progKws.join('.')}.${stat}`);
                }
                if (flawState.hasFlaw) {
                    if (stringBlocks.length > 0) {
                        let targetBlock = roll(stringBlocks.length) - 1;
                        stringBlocks[targetBlock] += flawState.flawString;
                    } else {
                        seedBlock += flawState.flawString;
                    }
                }
                buildString += `-${seedBlock}`;
                if (stringBlocks.length > 0) buildString += `-${stringBlocks.join('-')}`;
                let details = `  - Character (Level ${level})\n    > Seed: ${PsychroEngine.Data.KEYWORDS[seed].name} (${seed})\n`;
                if (flawState.hasFlaw) {
                    let flawCode = flawState.flawString.substring(1, 3);
                    let compCode = flawState.flawString.substring(3, 5);
                    details += `    > FLAW: ${PsychroEngine.Data.KEYWORDS[flawCode].name} / COMP: ${PsychroEngine.Data.KEYWORDS[compCode].name}\n`;
                }
                return { blueprint: buildString, details: details };
            }

            function generateAnimation(level) {
                let flawState = { hasFlaw: false, flawString: "" };
                let kws = [];
                let stringBlocks =[];
                let numKws = level + 1;
                for (let i = 0; i < numKws; i++) { kws.push(rollValidKeyword(flawState, kws)); }
                for (let i = 1; i <= level; i++) {
                    let stats = `${PsychroEngine.Data.STAT_KEYS[roll(9)-1]}${PsychroEngine.Data.STAT_KEYS[roll(9)-1]}`;
                    kws[i] += `.${stats}`; 
                }
                let buildString = `A:${kws.join('-')}`;
                if (flawState.hasFlaw) buildString += flawState.flawString;
                let details = `  - Animation Construct (Level ${level})\n    > Primary Trait: ${PsychroEngine.Data.KEYWORDS[kws[0].substring(0,2)].name} (${kws[0].substring(0,2)})\n`;
                return { blueprint: buildString, details: details };
            }

            function generateItem(level = -1) {
                let itemLevel = level >= 0 ? level : roll(10) - 1;
                let flawState = { hasFlaw: false, flawString: "" };
                let kws =[];
                let numKeywords = Math.max(1, Math.min(itemLevel, 5));
                for (let i = 0; i < numKeywords; i++) { kws.push(rollValidKeyword(flawState, kws)); }
                let buildString = `I:L${itemLevel}-${kws.join('.')}`;
                if (flawState.hasFlaw) buildString += flawState.flawString;
                let details = `  - Equipment Item (Level ${itemLevel})\n    > Keywords: ${kws.length}\n`;
                return { blueprint: buildString, details: details };
            }

            // --- The Master Generation Routine ---
            function executeGeneration() {
                const partyLevel = parseInt(document.getElementById('player-level-input').value) || 1;
                let finalSceneString = "";
                let manifestReadout = "";

                const complexity = Math.ceil(roll(10) / 2);
                const themeCode = rollD100Str();
                
                manifestReadout += `<span class="highlight-title">SCENE METADATA</span>\n`;
                manifestReadout += `Theme Aura: <span class="highlight-kw">${PsychroEngine.Data.KEYWORDS[themeCode].name}</span> (${themeCode})\n`;
                manifestReadout += `Total Situations: ${complexity}\n\n`;

                let sitCodes = [];
                let allManifests =[];

                for (let s = 0; s < complexity; s++) {
                    const typeRoll = roll(10);
                    let typeCode = 0;
                    if(typeRoll <= 2) typeCode = 1; else if(typeRoll <= 4) typeCode = 2;
                    else if(typeRoll <= 6) typeCode = 3; else if(typeRoll <= 8) typeCode = 4;
                    else if(typeRoll === 9) typeCode = 5;

                    const isRace = roll(10) <= 2;
                    sitCodes.push(`${isRace ? '*' : ''}${typeCode}`);
                    
                    manifestReadout += `<span class="highlight-title">SITUATION ${s + 1}</span> `;
                    manifestReadout += `<span class="highlight-type">[${PsychroEngine.Data.SITUATION_TYPES[typeCode]}]</span> `;
                    if (isRace) manifestReadout += `<span class="highlight-race">>> RACE SITUATION (THREAT CLOCK ACTIVE) <<</span>`;
                    manifestReadout += `\n`;

                    let numPackages = 0;
                    if (typeCode === 1) numPackages = Math.floor(roll(10)/3) + 1;
                    else if ([0,2,3,4].includes(typeCode)) numPackages = Math.floor(roll(10)/3);
                    else if (typeCode === 5) numPackages = 1;
                    if (numPackages === 0 && typeCode !== 5) numPackages = 1;

                    let situationEntities =[];
                    for (let p = 0; p < numPackages; p++) {
                        const pkgRoll = roll(100);
                        const entityLevel = getLevelMod(partyLevel);
                        
                        if (pkgRoll <= 20) {
                            const isBarrier = roll(10) <= 5;
                            const levelModStr = `L${entityLevel >= partyLevel ? '+' : ''}${entityLevel - partyLevel}`;
                            situationEntities.push(`[${isBarrier ? 'X' : 'Y}[${levelModStr}]]`);
                            manifestReadout += `  - ${isBarrier ? 'Barrier' : 'Puzzle'} Challenge (Target TN: ${10 + entityLevel})\n`;
                        } else if (pkgRoll <= 50) {
                            const animData = generateAnimation(entityLevel);
                            situationEntities.push(`[${animData.blueprint}]`);
                            manifestReadout += animData.details;
                        } else if (pkgRoll <= 70) {
                            const charData = generateCharacter(entityLevel);
                            situationEntities.push(`[${charData.blueprint}]`);
                            manifestReadout += charData.details;
                        } else if (pkgRoll <= 85) {
                            const itemData = generateItem();
                            situationEntities.push(`[${itemData.blueprint}]`);
                            manifestReadout += itemData.details;
                        } else {
                            const bossLevel = entityLevel + 1;
                            const charData = generateCharacter(bossLevel);
                            situationEntities.push(`[${charData.blueprint}]`);
                            manifestReadout += `  <span class="highlight-race">! HIGH THREAT !</span>\n` + charData.details;
                        }
                    }
                    allManifests.push(`[${situationEntities.join(',')}]`);
                    manifestReadout += `\n`;
                }

                finalSceneString = `(${complexity})[${themeCode}]-${sitCodes.join('|')}:${allManifests.join(',')}`;
                document.getElementById('output-string').value = finalSceneString;
                document.getElementById('manifest-details').innerHTML = manifestReadout;
            }

            document.getElementById('generate-button').addEventListener('click', executeGeneration);
            
            document.getElementById('copy-button').addEventListener('click', () => {
                const out = document.getElementById('output-string');
                out.select(); navigator.clipboard.writeText(out.value);
            });

            document.getElementById('send-dash-button').addEventListener('click', () => {
                const bp = document.getElementById('output-string').value;
                if(bp) window.parent.postMessage({ type: 'LOAD_SCENE', payload: bp }, '*');
            });

            executeGeneration();
        });
    </script>
</body>
</html>
