<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychromattica Character Sheet</title>
    <style>
        /* --- Google Font --- */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap');

        /* --- Base & Print Setup --- */
        :root {
            --main-border: #000000;
            --section-border: #AAAAAA;
            --label-bg: #E0E0E0;
            --label-text: #000000;
            --light-gray: #F5F5F5;
            --font-main: 'Oswald', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #FFF;
            margin: 0;
            padding: 0;
        }

        .page-container {
            width: 8.5in;
            height: 11in;
            padding: 0.25in;
            box-sizing: border-box;
            border: 4px solid var(--main-border);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            grid-template-rows: auto auto auto 1fr auto;
            gap: 15px;
            background-color: #fff;
            /* SVG Background Pattern from your design */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><g fill="none" stroke="%23EAEAEA" stroke-width="1"><path d="M0 10h10V0M20 10h10V0M0 30h10V20M20 30h10V20" /><path d="M10 20h10v10M30 20h10v10M10 40h10V30M30 40h10V30" /><path d="M20 0l-10 10l-10-10" /><path d="M40 0l-10 10l-10-10" /><path d="M20 20l-10 10l-10-10" /><path d="M40 20l-10 10l-10-10" /><path d="M0 20l10 10l10-10" /><path d="M20 40l10-10l10 10" /></g></svg>');
        }
        
        /* --- General Element Styles --- */
        h2 {
            font-size: 14pt;
            margin: 0;
            padding-bottom: 2px;
            border-bottom: 2px solid var(--main-border);
        }
        .input-line { border-bottom: 2px solid var(--main-border); }
        .input-box { border: 2px solid var(--main-border); }
        .small-box { width: 16px; height: 16px; border: 2px solid var(--main-border); }

        /* --- Header Section --- */
        .header {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: end;
            gap: 10px 20px;
        }
        .header .title {
            grid-column: 1 / 3;
            font-size: 36pt;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .header .logo {
            width: 40px; height: 40px;
            margin-right: 15px;
        }
        .header-field { display: flex; align-items: baseline; }
        .header-field label { margin-right: 8px; font-size: 12pt; white-space: nowrap; }
        .header-field .input-line { flex-grow: 1; }
        
        .season-box {
            display: flex; flex-direction: column;
            align-items: center;
            padding-left: 20px;
        }
        .season-box label { font-size: 10pt; background: var(--label-bg); padding: 2px 8px; }
        .season-box .input-box { width: 80px; height: 60px; margin-top: 2px; }
        
        .episode-tracker { display: flex; flex-direction: column; }
        .episode-tracker .input-line { height: 25px; }
        .episode-tracker .boxes { display: flex; gap: 4px; margin-top: 5px; }

        /* --- Profile Section --- */
        .profile {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--main-border);
            padding: 10px;
            background: white;
        }
        .profile-boxes { display: flex; gap: 10px; margin-top: 5px; }
        .profile-box {
            flex: 1; display: flex; flex-direction: column;
        }
        .profile-box label { text-align: center; background: var(--label-bg); padding: 3px; border: 2px solid var(--main-border); border-bottom: none; font-size: 10pt; }
        .profile-box .input-box { height: 40px; }

        /* --- Stats Section --- */
        .stats {
            display: flex;
            flex-direction: column;
            border: 2px solid var(--main-border);
            padding: 10px;
            background: white;
        }
        .stats-grid-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .stats-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .stat-box {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5px;
            font-size: 10pt;
        }
        .resistance-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .resistance-box label { text-align: center; font-size: 10pt; padding-bottom: 5px; }
        .resistance-box .input-box { height: 196px; /* 3*60 + 2*8 */ }

        /* --- Clocks Section --- */
        .clocks {
            border: 2px solid var(--main-border);
            padding: 10px;
            background: white;
        }
        .clock-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .clock-row label { font-size: 14pt; width: 35px; }

        /* --- Tags Section --- */
        .tags {
            border: 2px solid var(--main-border);
            padding: 10px;
            background: white;
            display: flex;
            gap: 10px;
        }
        .tag-group {
            flex: 1;
            border-radius: 15px;
            background: var(--label-bg);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag-group .label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 24pt;
            text-align: center;
            font-weight: 700;
        }
        .tag-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .tag-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tag-item label { font-size: 10pt; }
        .tag-checkboxes { display: flex; gap: 2px; }

        /* --- Keywords Section --- */
        .keywords {
            grid-row: 3 / 6;
            border: 2px solid var(--main-border);
            padding: 10px;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .keywords-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .keyword-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .keyword-item .input-line { height: 20px; flex-grow: 1; }
        .level-marker {
            background-color: var(--label-bg);
            border-radius: 10px;
            padding: 2px 10px;
            font-size: 10pt;
            width: 50px;
            text-align: center;
        }
        .flaw-section {
            margin-top: auto;
            padding-top: 10px;
            border-top: 2px solid var(--main-border);
        }
        .flaw-section h2 { border: none; }
        .flaw-section .input-box { width: 100%; height: 25px; margin-top: 5px; box-sizing: border-box;}

        /* --- Print Adjustments --- */
        @media print {
            body { -webkit-print-color-adjust: exact; color-adjust: exact; }
            .page-container { border: none; padding: 0; }
        }
    </style>
</head>
