<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Psychromattica OS</title>
    
    <!-- PWA MANIFEST -->
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#222222">

    <style>
        :root {
            --color-yellow: #f5d36c; 
            --color-silver: #a7a9ac; 
            --color-black: #414042;
            --color-background: #222222;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0; padding: 0; 
            background-color: var(--color-background); 
            overflow: hidden;
            font-family: Calibri, sans-serif;
        }
        .app-container { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
        }
        .content-area { 
            flex-grow: 1; 
            position: relative; 
        }
        /* The tool frames */
        .tool-frame {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            border: none; 
            visibility: hidden; 
            background-color: var(--color-background);
        }
        .tool-frame.active { 
            visibility: visible; 
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex; 
            background-color: #1a1a1a; 
            border-top: 1px solid var(--color-black);
            flex-shrink: 0;
            overflow-x: auto; /* Allow swiping if too many buttons for mobile */
        }
        .nav-button {
            flex: 1 1 auto; 
            padding: 12px 5px; 
            background: none; 
            border: none;
            color: var(--color-silver); 
            font-size: 8.5pt; 
            font-weight: bold; 
            text-transform: uppercase;
            cursor: pointer; 
            border-top: 3px solid transparent;
            transition: all 0.2s;
            min-width: 85px;
        }
        .nav-button.active {
            color: var(--color-yellow); 
            border-top-color: var(--color-yellow);
            background-color: var(--color-black);
        }
        /* Hide scrollbar for nav */
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- MAIN VIEWPORT -->
        <main class="content-area">
            <iframe src="01-profile-quiz.html" class="tool-frame active" data-tool="quiz" id="frame-quiz"></iframe>
            <iframe src="02-blueprint-builder.html" class="tool-frame" data-tool="builder" id="frame-builder"></iframe>
            <iframe src="03-character-sheet.html" class="tool-frame" data-tool="sheet" id="frame-sheet"></iframe>
            <iframe src="04-dice-roller.html" class="tool-frame" data-tool="roller" id="frame-roller"></iframe>
            <iframe src="05-scene-generator.html" class="tool-frame" data-tool="generator" id="frame-generator"></iframe>
            <iframe src="06-curator-dashboard.html" class="tool-frame" data-tool="dashboard" id="frame-dashboard"></iframe>
            <iframe src="07-companion.html" class="tool-frame" data/tool="companion" id="frame-companion"></iframe>
        </main>

        <!-- NAVIGATION -->
        <nav class="bottom-nav" id="main-nav">
            <button class="nav-button active" data-tool="quiz">Quiz</button>
            <button class="nav-button" data-tool="builder">Builder</button>
            <button class="nav-button" data much="sheet">Sheet</button>
            <button class="nav-button" data-tool="roller">Roller</button>
            <button class="nav-button" data-tool="generator">Gen</button>
            <button class="nav-button" data-tool="dashboard">Dash</button>
            <button class="nav-button" data-tool="companion">Comp</button>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 1. MANIFEST GENERATION (For Mobile "Add to Home Screen" Support)
            const manifestJSON = {
                "name": "Psychromattica OS", 
                "short_name": "Psychro", 
                "start_url": "PWA.html",
                "display": "standalone", 
                "background_color": "#222222", 
                "theme_color": "#222222",
                "icons": [
                    { "src": "icons/icon-192x192.png", "sizes": "192x192", "type": "image/png" },
                    { "src": "icons/icon-512x512.png", "sizes": "512x512", "type": "image/png" }
                ]
            };
            const manifestString = JSON.stringify(manifestJSON);
            const manifestUrl = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(manifestString)));
            document.getElementById('manifest-link').setAttribute('href', manifestUrl);

            // 2. NAVIGATION LOGIC
            const navButtons = document.querySelectorAll('.nav-button');
            const toolFrames = document.querySelectorAll('.tool-frame');
            
            function setActiveTool(toolName) {
                // Update Buttons
                navButtons.forEach(btn => {
                    if (btn.dataset.tool === toolName) {
                        btn.classList.add('active');
                        // Smooth scroll to the active button in the nav bar
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // Update Frames
                toolFrames.forEach(frame => {
                    frame.classList.toggle('active', frame.dataset.tool === toolName);
                });
            }

            navButtons.forEach(button => {
                button.addEventListener('click', () => setActiveTool(button.dataset.tool));
            });

            // 3. THE MESSAGE BUS (The Orchestrator)
            // This listens for "postMessage" calls from any of the child iframes.
            window.addEventListener('message', (event) => {
                const { type, payload } = event.data;
                console.log(`[PWA-BUS] Received: ${type}`, payload);

                // ROUTE: Quiz (01) -> Builder (02)
                if (type === 'ROUTE_PROFILE') {
                    const target = document.getElementById('frame-builder');
                    if (target) {
                        target.contentWindow.postMessage({ type: 'LOAD_PROFILE', payload: payload }, '*');
                        setActiveTool('builder');
                    }
                }
                
                // ROUTE: Builder (02) -> Character Sheet (03)
                if (type === 'LOAD_BLUEPRINT') {
                    const target = document.getElementById('frame-sheet');
                    if (target) {
                        target.contentWindow.postMessage({ type: 'LOAD_BLUEPRINT', payload: payload }, '*');
                        setActiveTool('sheet');
                    }
                }

                // ROUTE: Generator (05) -> Curator Dashboard (06)
                if (type === 'LOAD_SCENE') {
                    const target = document.getElementById('frame-dashboard');
                    if (target) {
                        target.contentWindow.postMessage({ type: 'LOAD_SCENE', payload: payload }, '*');
                        setActiveTool('dashboard');
                    }
                }
            });
        });
    </script>
</body>
</html>
